name: PR Quality Gates

on:
  push:
    branches: [dev]
  pull_request:
    branches:
      - dev
      - test
      - main

# Cancel a superseded run of the same pull request; never cancel anything else.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No Docker build here: security.yml's `image / Container Scan (Trivy)` job
# builds the same Dockerfile with the same USE_SLIM=true on every PR to these
# branches, and a broken build fails that job.
permissions:
  contents: read

jobs:
  # Job id and name kept so the check name does not change. `npm run build` is
  # not repeated here: the Dockerfile's `build` stage runs the same `npm ci
  # --force && npm run build` (Node 22, 8 GB heap) on the same tree in
  # security.yml's image job on every PR, and vitest does not need its output.
  frontend-build:
    if: github.event_name == 'pull_request'
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci --force

      - name: Run Frontend Unit Tests
        run: npm run test:frontend

  backend-format:
    if: github.event_name == 'pull_request'
    name: Backend Format (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Paths belong in `src`, not `args` — `src` defaults to the whole
      # workspace, so the paths below were never restricting the scope and ruff
      # was checking the entire repo. That went unnoticed until ruff enabled
      # markdown formatting by default, at which point it started reformatting
      # `.claude/commands/*.md` and `collab/docs/*.md` and failed every PR.
      # There are no markdown files under backend/ or scripts/.
      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check
          src: backend scripts

      # Logic-error sweep (undefined names etc.) — ported from upstream's
      # backend.yaml before it was disabled; caught a real F821 in this repo.
      - name: Ruff logic-error check
        uses: astral-sh/ruff-action@v3
        with:
          args: check --select=F --ignore=F401,F403,F405,F541,F811,F841 backend/ scripts/

  reuse:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      hit: ${{ steps.check.outputs.hit }}
    steps:
      - id: check
        uses: Gradient-DS/security-ci/actions/tested-tree/check@e18c245d84975f79da5c97d1987b83039c13292e # v8
        with:
          workflow-key: backend-tests

  changes:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.result != 'failure' && needs.reuse.outputs.hit != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v4.0.2
        id: filter
        with:
          # Compare the entire push, including multi-commit pushes to dev.
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/pr-checks.yaml'

  # Keep this required check green for unrelated paths and exact-tree reuse,
  # but red if either lookup fails. Expensive steps run only after this gate.
  backend-tests:
    name: Backend Unit Tests
    needs: [reuse, changes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested: ${{ steps.pytest.outcome == 'success' }}
    steps:
      - name: Decide whether to run tests
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REUSE: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.hit }}
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.changes.outputs.backend }}
        run: |
          if [ "$EVENT" = push ] && [ "$REUSE" != success ]; then echo 'tested-tree lookup did not succeed'; exit 1; fi
          if [ "$EVENT" = push ] && [ "$REUSE" = success ] && [ "$REUSED" = true ] && [ "$CHANGES" = skipped ]; then echo 'Exact tree already passed Backend Unit Tests'; exit 0; fi
          [ "$CHANGES" = success ] || { echo 'Path lookup did not succeed'; exit 1; }
          case "$BACKEND" in true) echo 'run=true' >> "$GITHUB_OUTPUT" ;; false) echo 'No backend paths changed' ;; *) exit 1 ;; esac

      - name: Checkout Repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            backend/requirements-security-ci.txt
            pyproject.toml

      - name: Install system dependencies
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev libmagic1 libpango-1.0-0 libpangoft2-1.0-0

      - name: Read private test tooling
        if: steps.gate.outputs.run == 'true'
        id: tooling-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v4.2.0
        with:
          app-id: ${{ secrets.SECURITY_CI_APP_ID }}
          private-key: ${{ secrets.SECURITY_CI_APP_PRIVATE_KEY }}
          owner: Gradient-DS
          repositories: security-ci

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.tooling-token.outputs.token }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!gh auth git-credential'
        run: |
          uv venv
          uv pip install -r backend/requirements.txt -r backend/requirements-security-ci.txt

      # Start PostgreSQL only when testing; a job-level service also starts on
      # filtered and reused runs. Every integration test gets its own database.
      - name: Start test PostgreSQL
        if: steps.gate.outputs.run == 'true'
        run: |
          docker run --detach --name backend-tests-postgres -e POSTGRES_PASSWORD=backend-test -e POSTGRES_DB=backend_tests -p 127.0.0.1:5432:5432 postgres:16-alpine
          for _ in {1..30}; do if docker exec backend-tests-postgres pg_isready -U postgres; then exit 0; fi; sleep 1; done
          docker logs backend-tests-postgres
          exit 1

      - name: Run backend suite
        if: steps.gate.outputs.run == 'true'
        id: pytest
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          WEBUI_SECRET_KEY: test-secret-key
          BACKEND_TEST_DATABASE_URL: postgresql+psycopg://postgres:backend-test@127.0.0.1:5432/backend_tests
        # Only live HTTP attack passes and their hits-file gates are excluded.
        run: ../.venv/bin/python -m pytest open_webui/test/ --ignore-glob='**/security/test_live_*.py' --ignore-glob='**/security/attack/test_live_*.py' -n auto --tb=short -q

      - name: Remove test PostgreSQL
        if: always() && steps.gate.outputs.run == 'true'
        run: docker rm -f backend-tests-postgres 2>/dev/null || true

  helm-lint:
    if: github.event_name == 'pull_request'
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Lint Helm chart
        run: helm lint helm/open-webui-tenant

      - name: Template Helm chart (catch rendering errors)
        run: helm template test-release helm/open-webui-tenant > /dev/null

      - name: Template Helm chart with external Postgres values
        # All six DB consumers must point at postgres.host, none at the bundled Service.
        run: |
          helm template test-release helm/open-webui-tenant -f helm/open-webui-tenant/ci/external-postgres-values.yaml > /tmp/external-postgres.yaml
          test "$(grep -c 'pg-external.database-staging' /tmp/external-postgres.yaml)" -eq 6
          ! grep -q 'open-webui-tenant-postgres' /tmp/external-postgres.yaml

  # Record only same-repository PRs whose tests really ran and whose other
  # quality checks passed. A path-only no-op cannot certify an untested tree.
  record:
    needs: [backend-tests, frontend-build, backend-format, helm-lint]
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.backend-tests.result == 'success'
      && needs.backend-tests.outputs.tested == 'true'
      && needs.frontend-build.result == 'success'
      && needs.backend-format.result == 'success'
      && needs.helm-lint.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Gradient-DS/security-ci/actions/tested-tree/record@e18c245d84975f79da5c97d1987b83039c13292e # v8
        with:
          workflow-key: backend-tests
