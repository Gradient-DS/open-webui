# Derivation gaps measured from committed security/openapi.json using openapi-surface.
# Phase 4b audited all 27 previously labelled untyped JSON write bodies.
# 20 blind body operations remain: 15 JSON writes, 1 JSON read, 4 multipart.
# The writes include typed boolean/integer-only bodies, author-defined
# valve bodies, an arbitrary config-import blob, and typed maps whose
# dynamic keys the derivation deliberately does not traverse.
# Exact set equality in test_writable_fields.py rejects missing or stale waivers.
# Known fields in open objects are not exhaustive coverage of extension data.

[[waived]]
id = "POST /api/v1/folders/{id}/update/expanded"
reason = "FolderIsExpandedForm already declares only is_expanded (boolean). There are no named string leaves for the string-only corpus; further body typing would not help. Revisit if string fields are added or the corpus supports boolean/integer values."

[[waived]]
id = "POST /api/v1/functions/id/{id}/valves/user/update"
reason = "Free-form key/value body defined by the function author, not a fixed shape the static derivation can enumerate. The handler loads the installed author-defined UserValves model at runtime. Future coverage must obtain the selected author schema at runtime; do not invent global valve fields."

