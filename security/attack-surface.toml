description = "routers/chats.py:create_new_chat persists the supplied history dictionary; models/chats.py:insert_new_chat also indexes messages. No model completion needed. The message carries one pending function_call so utils/tool_approval.py:resolve_tool_call_output finds a tool call to resolve. Use the admin folder owner; create_new_chat validates folder ownership even for admins."
via = "POST /api/v1/chats/new"
body = { "folder_id" = "{folder}", "chat" = { "title" = "attack-{token}", "models" = ["{model}"], "history" = { "currentId" = "message_{token}", "messages" = { "message_{token}" = { "id" = "message_{token}", "role" = "assistant", "model" = "{model}", "content" = "Attack fixture message.", "childrenIds" = [], "output" = [{ "type" = "function_call", "call_id" = "call_{token}", "name" = "attack_tool", "status" = "pending" }] } } } } }
extract = "id"
depends_on = ["folder", "model"]
actor = "admin"

