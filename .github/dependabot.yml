version: 2
updates:
  - package-ecosystem: uv
    directory: '/'
    schedule:
      interval: monthly
    target-branch: dev
    cooldown:
      default-days: 14

  - package-ecosystem: pip
    directory: '/backend'
    schedule:
      interval: monthly
    target-branch: dev
    cooldown:
      default-days: 14

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    target-branch: dev
    cooldown:
      default-days: 14

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    target-branch: dev
    cooldown:
      default-days: 14
