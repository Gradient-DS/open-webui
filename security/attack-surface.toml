[[destructive]]
id = "POST /api/v1/auths/signout"
reason = "Revokes the caller JWT jti when Redis is present. CI runs real Redis; the same bearer cannot drive subsequent routes."

[[destructive]]
id = "DELETE /api/v1/auths/api_key"
reason = "Deletes the caller API key and invalidates an API-key driving identity."

[[destructive]]
id = "POST /api/v1/auths/update/password"
reason = "Changes the caller password and breaks subsequent signin/identity recovery using the old credential."

[[destructive]]
id = "DELETE /api/v1/users/{user_id}"
reason = "Can delete the driving user and its owned resources. Schedule with a disposable identity after ordinary targets."

[[destructive]]
id = "DELETE /api/v1/auths/oauth/sessions/{provider}"
reason = "Deletes the caller provider session, removing OAuth credentials needed by later provider requests."
