reason = "Never attempted: every owner pass skips it because `provider` is declared unseedable (attack-surface.toml, key oauth_exchange_provider). auths.py:token_exchange needs an environment-registered OAUTH_PROVIDERS entry and an access token from its issuer; neither can be created through the application's HTTP API. Closes with an OIDC issuer stub."

[[waived]]
id = "DELETE /api/v1/auths/oauth/sessions/{provider}"
reason = "Never attempted: every owner pass skips it because `provider` is declared unseedable (attack-surface.toml, key oauth_session_provider). auths.py:delete_oauth_session_by_provider needs an OAuthSessions row for the caller, which only a completed external authorization-code exchange creates. Closes with an OIDC issuer stub."

