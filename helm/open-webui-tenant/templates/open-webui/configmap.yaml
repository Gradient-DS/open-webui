{{- if .Values.openWebui.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-webui-tenant.openWebui.fullname" . }}-config
  labels:
    {{- include "open-webui-tenant.openWebui.labels" . | nindent 4 }}
data:
  # Deployment
  ENV: {{ .Values.openWebui.config.env | quote }}
  ENABLE_PERSISTENT_CONFIG: {{ .Values.openWebui.config.enablePersistentConfig | quote }}
  RESET_CONFIG_ON_START: {{ .Values.openWebui.config.resetConfigOnStart | quote }}
  WEBUI_NAME: {{ .Values.openWebui.config.webuiName | quote }}
  CLIENT_NAME: {{ .Values.tenant.clientName | quote }}
  TENANT_NAME: {{ .Values.tenant.name | default .Release.Namespace | quote }}
  CORS_ALLOW_ORIGIN: {{ .Values.openWebui.config.corsAllowOrigin | default (printf "https://%s" .Values.tenant.domain) | quote }}

  {{- with .Values.soevApi.url }}
  SOEV_API_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.soevApi.servicePrincipal }}
  SOEV_API_SERVICE_PRINCIPAL: {{ . | quote }}
  {{- end }}
  {{- if and (ne .Values.liveDocuments.enabled nil) (ne (toString .Values.liveDocuments.enabled) "") }}
  ENABLE_LIVE_DOCUMENTS: {{ .Values.liveDocuments.enabled | quote }}
  {{- end }}
  {{- if and (ne .Values.liveMail.enabled nil) (ne (toString .Values.liveMail.enabled) "") }}
  ENABLE_LIVE_MAIL: {{ .Values.liveMail.enabled | quote }}
  {{- end }}
  {{- with .Values.webuiUrl }}
  WEBUI_URL: {{ . | quote }}
  {{- end }}

  # Locale
  DEFAULT_LOCALE: {{ .Values.openWebui.config.defaultLocale | quote }}

  # Authentication
  WEBUI_AUTH: {{ .Values.openWebui.config.webuiAuth | quote }}
  DEFAULT_USER_ROLE: {{ .Values.openWebui.config.defaultUserRole | quote }}
  ENABLE_OAUTH_SIGNUP: {{ .Values.openWebui.config.enableOauthSignup | quote }}
  OAUTH_INVITE_REQUIRED: {{ .Values.openWebui.config.oauthInviteRequired | quote }}
  JWT_EXPIRES_IN: {{ .Values.openWebui.config.jwtExpiresIn | quote }}

  # Microsoft OAuth / EntraID SSO
  {{- if .Values.openWebui.config.microsoftClientId }}
  MICROSOFT_CLIENT_ID: {{ .Values.openWebui.config.microsoftClientId | quote }}
  MICROSOFT_CLIENT_TENANT_ID: {{ .Values.openWebui.config.microsoftClientTenantId | quote }}
  MICROSOFT_REDIRECT_URI: {{ .Values.openWebui.config.microsoftRedirectUri | quote }}
  MICROSOFT_OAUTH_SCOPE: {{ .Values.openWebui.config.microsoftOauthScope | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.openidProviderUrl }}
  OPENID_PROVIDER_URL: {{ .Values.openWebui.config.openidProviderUrl | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.oauthAllowedDomains }}
  OAUTH_ALLOWED_DOMAINS: {{ .Values.openWebui.config.oauthAllowedDomains | quote }}
  {{- end }}

  # LLM Providers
  ENABLE_OLLAMA_API: {{ .Values.openWebui.config.enableOllamaApi | quote }}
  ENABLE_FORWARD_USER_INFO_HEADERS: {{ .Values.openWebui.config.enableForwardUserInfoHeaders | quote }}
  FORWARD_USER_INFO_HEADER_USER_ID: {{ .Values.openWebui.config.forwardUserInfoHeaderUserId | quote }}

  # Vector Database (Weaviate) - local to tenant namespace
  VECTOR_DB: {{ .Values.openWebui.config.vectorDb | quote }}
  {{- if eq .Values.openWebui.config.vectorDb "pgvector" }}
  PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH: {{ .Values.pgvector.maxVectorLength | quote }}
  PGVECTOR_CREATE_EXTENSION: {{ .Values.pgvector.createExtension | quote }}
  {{- end }}
  {{- /*
  Hosts default to this release's own Weaviate, rendering exactly the string the
  hard-coded template produced before, so every existing tenant's ConfigMap —
  and therefore its checksum/config annotation — is unchanged. Override both to
  point Open WebUI at a Weaviate owned by something else: mkbot shares the agent
  stack's instance because its own is retired (weaviate.enabled false), and Open
  WebUI's client connects eagerly at boot, so VECTOR_DB must name a Service that
  actually exists. A Helm comment, not a YAML one — a rendered comment would
  change checksum/config and roll every tenant's pods on upgrade.
  */}}
  WEAVIATE_HTTP_HOST: {{ .Values.openWebui.config.weaviateHttpHost | default (include "open-webui-tenant.weaviate.fullname" .) }}
  WEAVIATE_HTTP_PORT: {{ .Values.openWebui.config.weaviateHttpPort | quote }}
  WEAVIATE_GRPC_HOST: {{ .Values.openWebui.config.weaviateGrpcHost | default (include "open-webui-tenant.weaviate.fullname" .) }}
  WEAVIATE_GRPC_PORT: {{ .Values.openWebui.config.weaviateGrpcPort | quote }}
  WEAVIATE_WEB_SEARCH_TTL_MINUTES: {{ .Values.openWebui.config.weaviateWebSearchTtlMinutes | quote }}
  ENABLE_WEAVIATE_BQ_QUANTIZATION: {{ .Values.openWebui.config.enableWeaviateBqQuantization | default "false" | quote }}
  # Hardcoded skew guard: images since the 2026-07 MT cleanup ignore this; older
  # images default to the (removed) legacy connector without it. Drop this line
  # once every track runs a cleanup-era image.
  ENABLE_WEAVIATE_MULTITENANCY_MODE: "true"

  # Database (PostgreSQL) - local to tenant namespace
  DATABASE_TYPE: {{ .Values.openWebui.config.databaseType | quote }}
  DATABASE_USER: {{ .Values.openWebui.config.databaseUser | quote }}
  DATABASE_HOST: {{ include "open-webui-tenant.postgres.host" . }}
  DATABASE_PORT: {{ include "open-webui-tenant.postgres.port" . | quote }}
  DATABASE_NAME: {{ .Values.openWebui.config.databaseName | quote }}

  # Upload and retrieval limits
  RAG_TOP_K: {{ .Values.openWebui.config.ragTopK | quote }}
  RAG_TOP_K_RERANKER: {{ .Values.openWebui.config.ragTopKReranker | quote }}
  RAG_RELEVANCE_THRESHOLD: {{ .Values.openWebui.config.ragRelevanceThreshold | quote }}
  RAG_HYBRID_BM25_WEIGHT: {{ .Values.openWebui.config.ragHybridBm25Weight | quote }}
  ENABLE_RAG_HYBRID_SEARCH: {{ .Values.openWebui.config.enableRagHybridSearch | quote }}
  RAG_ALLOWED_FILE_EXTENSIONS: {{ .Values.openWebui.config.ragAllowedFileExtensions | quote }}

  # Upload guard (Phase 2 hardening)
  RAG_FILE_MAX_SIZE: {{ .Values.openWebui.config.ragFileMaxSize | quote }}
  RAG_FILE_MAX_COUNT_PER_USER: {{ .Values.openWebui.config.ragFileMaxCountPerUser | quote }}
  RAG_FILE_SNIFF_MODE: {{ .Values.openWebui.config.ragFileSniffMode | quote }}

  # File Processing
  FILE_PROCESSING_MAX_CONCURRENT: {{ .Values.openWebui.config.fileProcessingMaxConcurrent | quote }}
  FILE_DOWNLOAD_CONCURRENCY_MULTIPLIER: {{ .Values.openWebui.config.fileDownloadConcurrencyMultiplier | quote }}

  # Content Extraction & Reranking (via shared services)
  CONTENT_EXTRACTION_ENGINE: {{ .Values.openWebui.config.contentExtractionEngine | quote }}
  # Defaults to the shared-services gateway in `sharedServices.namespace`.
  # Tenants on a split-namespace setup (e.g. octobox: LiteLLM/reranker on
  # prod shared-services but doc-loader on staging-shared-services) can
  # override the URL explicitly via openWebui.config.externalDocumentLoaderUrl
  # without touching sharedServices.namespace.
  EXTERNAL_DOCUMENT_LOADER_URL: {{ .Values.openWebui.config.externalDocumentLoaderUrl | default (include "open-webui-tenant.sharedServices.gatewayUrl" .) | quote }}

  # Platform web search availability
  ENABLE_WEB_SEARCH: {{ .Values.openWebui.config.enableWebSearch | quote }}

  # Feature Flags
  FEATURE_CHAT_CONTROLS: {{ .Values.openWebui.config.featureChatControls | quote }}
  FEATURE_CAPTURE: {{ .Values.openWebui.config.featureCapture | quote }}
  FEATURE_ARTIFACTS: {{ .Values.openWebui.config.featureArtifacts | quote }}
  FEATURE_PLAYGROUND: {{ .Values.openWebui.config.featurePlayground | quote }}
  FEATURE_CHAT_OVERVIEW: {{ .Values.openWebui.config.featureChatOverview | quote }}
  FEATURE_NOTES_AI_CONTROLS: {{ .Values.openWebui.config.featureNotesAiControls | quote }}
  FEATURE_VOICE: {{ .Values.openWebui.config.featureVoice | quote }}
  FEATURE_VOICE_CALL: {{ .Values.openWebui.config.featureVoiceCall | quote }}
  FEATURE_READ_ALOUD: {{ .Values.openWebui.config.featureReadAloud | quote }}
  FEATURE_CHANGELOG: {{ .Values.openWebui.config.featureChangelog | quote }}
  FEATURE_MEETINGS: {{ .Values.openWebui.config.featureMeetings | quote }}
  FEATURE_SYSTEM_PROMPT: {{ .Values.openWebui.config.featureSystemPrompt | quote }}
  FEATURE_MODELS: {{ .Values.openWebui.config.featureModels | quote }}
  FEATURE_MODEL_METERS: {{ .Values.openWebui.config.featureModelMeters | quote }}
  FEATURE_KNOWLEDGE: {{ .Values.openWebui.config.featureKnowledge | quote }}
  FEATURE_PROMPTS: {{ .Values.openWebui.config.featurePrompts | quote }}
  FEATURE_SKILLS: {{ .Values.openWebui.config.featureSkills | quote }}
  # Soev skill-bundles feature. FEATURE_SKILL_FILES = simple skills (files/tree/
  # editing forwarded to the agent). ENABLE_SKILL_EXECUTION = full mode (adds the
  # scoped-token mint so the agent can run bundled scripts via the skill-exec
  # sandbox). Pair ENABLE_SKILL_EXECUTION with the agent's skill_execution_enabled.
  FEATURE_SKILL_FILES: {{ .Values.openWebui.config.featureSkillFiles | quote }}
  ENABLE_SKILL_EXECUTION: {{ .Values.openWebui.config.enableSkillExecution | quote }}
  FEATURE_CHAT_CONTROLS_SECTIONS: {{ .Values.openWebui.config.featureChatControlsSections | quote }}
  FEATURE_REFERENCE_CHATS: {{ .Values.openWebui.config.featureReferenceChats | quote }}
  FEATURE_SIMPLE_ASSISTANT_BUILDER: {{ .Values.openWebui.config.featureSimpleAssistantBuilder | quote }}
  FEATURE_INPUT_MENU: {{ .Values.openWebui.config.featureInputMenu | quote }}
  FEATURE_TEMPORARY_CHAT: {{ .Values.openWebui.config.featureTemporaryChat | quote }}
  FEATURE_TERMINAL_SERVERS: {{ .Values.openWebui.config.featureTerminalServers | quote }}
  FEATURE_STRICT_DATA_SEPARATION: {{ .Values.openWebui.config.featureStrictDataSeparation | quote }}
  WHATS_NEW_MODELS: {{ .Values.openWebui.config.whatsNewModels | toJson | quote }}

  # Welcome message (PersistentConfig: env seeds initial value; admin UI wins thereafter)
  ENABLE_WELCOME_MESSAGE: {{ .Values.openWebui.config.enableWelcomeMessage | quote }}

  # PDF export
  USE_STYLIZED_PDF_EXPORT: {{ .Values.openWebui.config.useStylizedPdfExport | quote }}

  # Memories
  ENABLE_MEMORIES: {{ .Values.openWebui.config.enableMemories | quote }}

  # Notes
  ENABLE_NOTES: {{ .Values.openWebui.config.enableNotes | quote }}
  USER_PERMISSIONS_FEATURES_NOTES: {{ .Values.openWebui.config.userPermissionsFeaturesNotes | quote }}

  # Knowledge
  USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: {{ .Values.openWebui.config.userPermissionsWorkspaceKnowledgeAccess | quote }}

  # Code Execution
  ENABLE_CODE_INTERPRETER: {{ .Values.openWebui.config.enableCodeInterpreter | quote }}
  ENABLE_CODE_EXECUTION: {{ .Values.openWebui.config.enableCodeExecution | quote }}
  USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: {{ .Values.openWebui.config.userPermissionsFeaturesCodeInterpreter | quote }}

  # Document Writer
  ENABLE_DOCUMENT_WRITER: {{ .Values.openWebui.config.enableDocumentWriter | quote }}
  USER_PERMISSIONS_FEATURES_DOCUMENT_WRITER: {{ .Values.openWebui.config.userPermissionsFeaturesDocumentWriter | quote }}

  # DOCX export
  ENABLE_DOCX_EXPORT: {{ .Values.openWebui.config.enableDocxExport | default "true" | quote }}

  # Agent trace download (admins)
  ENABLE_AGENT_TRACE_DOWNLOAD: {{ .Values.openWebui.config.enableAgentTraceDownload | default "false" | quote }}

  # Legacy permission metadata
  USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: {{ .Values.openWebui.config.userPermissionsFeaturesDirectToolServers | quote }}

  # Audio
  USER_PERMISSIONS_CHAT_TTS: {{ .Values.openWebui.config.userPermissionsChatTts | quote }}
  USER_PERMISSIONS_CHAT_STT: {{ .Values.openWebui.config.userPermissionsChatStt | quote }}
  USER_PERMISSIONS_CHAT_CALL: {{ .Values.openWebui.config.userPermissionsChatCall | quote }}

  # Workspace
  USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: {{ .Values.openWebui.config.userPermissionsWorkspaceModelsAccess | quote }}
  USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: {{ .Values.openWebui.config.userPermissionsWorkspacePromptsAccess | quote }}
  USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: {{ .Values.openWebui.config.userPermissionsWorkspaceToolsAccess | quote }}

  # Workspace Sharing (allow users to share with specific groups/individuals)
  USER_PERMISSIONS_WORKSPACE_MODELS_ALLOW_SHARING: {{ .Values.openWebui.config.userPermissionsWorkspaceModelsAllowSharing | quote }}
  USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ALLOW_SHARING: {{ .Values.openWebui.config.userPermissionsWorkspaceKnowledgeAllowSharing | quote }}
  USER_PERMISSIONS_WORKSPACE_PROMPTS_ALLOW_SHARING: {{ .Values.openWebui.config.userPermissionsWorkspacePromptsAllowSharing | quote }}
  USER_PERMISSIONS_WORKSPACE_TOOLS_ALLOW_SHARING: {{ .Values.openWebui.config.userPermissionsWorkspaceToolsAllowSharing | quote }}
  USER_PERMISSIONS_WORKSPACE_SKILLS_ALLOW_SHARING: {{ .Values.openWebui.config.userPermissionsWorkspaceSkillsAllowSharing | quote }}
  USER_PERMISSIONS_NOTES_ALLOW_SHARING: {{ .Values.openWebui.config.userPermissionsNotesAllowSharing | quote }}

  # Workspace Public Sharing (allow users to share with all tenant users)
  USER_PERMISSIONS_WORKSPACE_MODELS_ALLOW_PUBLIC_SHARING: {{ .Values.openWebui.config.userPermissionsWorkspaceModelsAllowPublicSharing | quote }}
  USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ALLOW_PUBLIC_SHARING: {{ .Values.openWebui.config.userPermissionsWorkspaceKnowledgeAllowPublicSharing | quote }}
  USER_PERMISSIONS_WORKSPACE_PROMPTS_ALLOW_PUBLIC_SHARING: {{ .Values.openWebui.config.userPermissionsWorkspacePromptsAllowPublicSharing | quote }}
  USER_PERMISSIONS_WORKSPACE_TOOLS_ALLOW_PUBLIC_SHARING: {{ .Values.openWebui.config.userPermissionsWorkspaceToolsAllowPublicSharing | quote }}
  USER_PERMISSIONS_WORKSPACE_SKILLS_ALLOW_PUBLIC_SHARING: {{ .Values.openWebui.config.userPermissionsWorkspaceSkillsAllowPublicSharing | quote }}
  USER_PERMISSIONS_NOTES_ALLOW_PUBLIC_SHARING: {{ .Values.openWebui.config.userPermissionsNotesAllowPublicSharing | quote }}

  # Access Grants
  USER_PERMISSIONS_ACCESS_GRANTS_ALLOW_USERS: {{ .Values.openWebui.config.userPermissionsAccessGrantsAllowUsers | quote }}

  # UI
  {{- if .Values.openWebui.config.greetingTemplate }}
  GREETING_TEMPLATE: {{ .Values.openWebui.config.greetingTemplate | quote }}
  {{- end }}
  DEFAULT_PROMPT_SUGGESTIONS: {{ .Values.openWebui.config.defaultPromptSuggestions | quote }}
  {{- if .Values.openWebui.config.defaultModels }}
  DEFAULT_MODELS: {{ .Values.openWebui.config.defaultModels | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.modelHosting }}
  MODEL_HOSTING: {{ .Values.openWebui.config.modelHosting | toJson | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.modelProfiles }}
  MODEL_PROFILES: {{ .Values.openWebui.config.modelProfiles | toJson | quote }}
  {{- end }}
  ENABLE_FOLDERS: {{ .Values.openWebui.config.enableFolders | quote }}
  USER_PERMISSIONS_FEATURES_FOLDERS: {{ .Values.openWebui.config.userPermissionsFeaturesFolders | quote }}
  ENABLE_COMMUNITY_SHARING: {{ .Values.openWebui.config.enableCommunitySharing | quote }}
  ENABLE_CITATION_RELEVANCE: {{ .Values.openWebui.config.enableCitationRelevance | quote }}
  ENABLE_CITATION_TEXT_HIGHLIGHT: {{ .Values.openWebui.config.enableCitationTextHighlight | quote }}
  ENABLE_MESSAGE_RATING: {{ .Values.openWebui.config.enableMessageRating | quote }}
  ENABLE_AUTOCOMPLETE_GENERATION: {{ .Values.openWebui.config.enableAutocompleteGeneration | quote }}
  ENABLE_FOLLOW_UP_GENERATION: {{ .Values.openWebui.config.enableFollowUpGeneration | quote }}
  ENABLE_TITLE_GENERATION: {{ .Values.openWebui.config.enableTitleGeneration | quote }}
  ENABLE_TAGS_GENERATION: {{ .Values.openWebui.config.enableTagsGeneration | quote }}
  ENABLE_SEARCH_QUERY_GENERATION: {{ .Values.openWebui.config.enableSearchQueryGeneration | quote }}
  ENABLE_RETRIEVAL_QUERY_GENERATION: {{ .Values.openWebui.config.enableRetrievalQueryGeneration | quote }}

  # Chat Permissions
  USER_PERMISSIONS_CHAT_CONTROLS: {{ .Values.openWebui.config.userPermissionsChatControls | quote }}
  USER_PERMISSIONS_CHAT_VALVES: {{ .Values.openWebui.config.userPermissionsChatValves | quote }}
  USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: {{ .Values.openWebui.config.userPermissionsChatSystemPrompt | quote }}
  USER_PERMISSIONS_CHAT_PARAMS: {{ .Values.openWebui.config.userPermissionsChatParams | quote }}
  USER_PERMISSIONS_CHAT_FILE_UPLOAD: {{ .Values.openWebui.config.userPermissionsChatFileUpload | quote }}
  USER_PERMISSIONS_CHAT_DELETE: {{ .Values.openWebui.config.userPermissionsChatDelete | quote }}
  USER_PERMISSIONS_CHAT_DELETE_MESSAGE: {{ .Values.openWebui.config.userPermissionsChatDeleteMessage | quote }}
  USER_PERMISSIONS_CHAT_EDIT: {{ .Values.openWebui.config.userPermissionsChatEdit | quote }}
  USER_PERMISSIONS_CHAT_SHARE: {{ .Values.openWebui.config.userPermissionsChatShare | quote }}
  USER_PERMISSIONS_CHAT_EXPORT: {{ .Values.openWebui.config.userPermissionsChatExport | quote }}
  USER_PERMISSIONS_CHAT_CONTINUE_RESPONSE: {{ .Values.openWebui.config.userPermissionsChatContinueResponse | quote }}
  USER_PERMISSIONS_CHAT_REGENERATE_RESPONSE: {{ .Values.openWebui.config.userPermissionsChatRegenerateResponse | quote }}
  USER_PERMISSIONS_CHAT_RATE_RESPONSE: {{ .Values.openWebui.config.userPermissionsChatRateResponse | quote }}
  USER_PERMISSIONS_CHAT_MULTIPLE_MODELS: {{ .Values.openWebui.config.userPermissionsChatMultipleModels | quote }}
  USER_PERMISSIONS_CHAT_TEMPORARY: {{ .Values.openWebui.config.userPermissionsChatTemporary | quote }}
  USER_PERMISSIONS_FEATURES_WEB_SEARCH: {{ .Values.openWebui.config.userPermissionsFeaturesWebSearch | quote }}
  USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: {{ .Values.openWebui.config.userPermissionsFeaturesImageGeneration | quote }}
  USER_PERMISSIONS_FEATURES_API_KEYS: {{ .Values.openWebui.config.userPermissionsFeaturesApiKeys | quote }}

  # Admin
  ENABLE_DATA_EXPORT: {{ .Values.openWebui.config.enableDataExport | quote }}
  DATA_EXPORT_RETENTION_HOURS: {{ .Values.openWebui.config.dataExportRetentionHours | quote }}
  # Legacy feedback access only.
  ENABLE_PLUGINS: {{ .Values.openWebui.config.enablePlugins | quote }}
  ENABLE_EVALUATION_ARENA_MODELS: {{ .Values.openWebui.config.enableEvaluationArenaModels | quote }}
  ENABLE_API_KEYS: {{ .Values.openWebui.config.enableApiKeys | quote }}
  # Google Drive Integration
  ENABLE_GOOGLE_DRIVE_INTEGRATION: {{ .Values.openWebui.config.enableGoogleDriveIntegration | quote }}
  {{- if .Values.openWebui.config.googleDriveClientId }}
  GOOGLE_DRIVE_CLIENT_ID: {{ .Values.openWebui.config.googleDriveClientId | quote }}
  {{- end }}
  {{- /* googleDriveApiKey moved to secrets template */ -}}

  # OneDrive Integration
  ENABLE_ONEDRIVE_INTEGRATION: {{ .Values.openWebui.config.enableOnedriveIntegration | quote }}
  ENABLE_ONEDRIVE_BUSINESS: {{ .Values.openWebui.config.enableOnedriveBusiness | quote }}
  {{- if .Values.openWebui.config.onedriveClientIdBusiness }}
  ONEDRIVE_CLIENT_ID_BUSINESS: {{ .Values.openWebui.config.onedriveClientIdBusiness | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.onedriveSharepointUrl }}
  ONEDRIVE_SHAREPOINT_URL: {{ .Values.openWebui.config.onedriveSharepointUrl | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.onedriveSharepointTenantId }}
  ONEDRIVE_SHAREPOINT_TENANT_ID: {{ .Values.openWebui.config.onedriveSharepointTenantId | quote }}
  {{- end }}

  KNOWLEDGE_MAX_FILE_COUNT: {{ .Values.openWebui.config.knowledgeMaxFileCount | quote }}
  # Email Invites (Microsoft Graph API)
  ENABLE_EMAIL_INVITES: {{ .Values.openWebui.config.enableEmailInvites | quote }}
  {{- if .Values.openWebui.config.emailGraphTenantId }}
  EMAIL_GRAPH_TENANT_ID: {{ .Values.openWebui.config.emailGraphTenantId | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.emailGraphClientId }}
  EMAIL_GRAPH_CLIENT_ID: {{ .Values.openWebui.config.emailGraphClientId | quote }}
  {{- end }}
  EMAIL_FROM_ADDRESS: {{ .Values.openWebui.config.emailFromAddress | quote }}
  EMAIL_FROM_NAME: {{ .Values.openWebui.config.emailFromName | quote }}
  INVITE_EXPIRY_HOURS: {{ .Values.openWebui.config.inviteExpiryHours | quote }}
  {{- if .Values.openWebui.config.emailInviteSubject }}
  EMAIL_INVITE_SUBJECT: {{ .Values.openWebui.config.emailInviteSubject | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.emailInviteHeading }}
  EMAIL_INVITE_HEADING: {{ .Values.openWebui.config.emailInviteHeading | quote }}
  {{- end }}

  BYPASS_MODEL_ACCESS_CONTROL: {{ .Values.openWebui.config.bypassModelAccessControl | quote }}

  # Security Headers
  {{- with .Values.openWebui.config.securityHeaders }}
  {{- if .hsts }}
  HSTS: {{ .hsts | quote }}
  {{- end }}
  {{- if .xFrameOptions }}
  XFRAME_OPTIONS: {{ .xFrameOptions | quote }}
  {{- end }}
  {{- if .xContentType }}
  XCONTENT_TYPE: {{ .xContentType | quote }}
  {{- end }}
  {{- if .referrerPolicy }}
  REFERRER_POLICY: {{ .referrerPolicy | quote }}
  {{- end }}
  {{- if .cacheControl }}
  CACHE_CONTROL: {{ .cacheControl | quote }}
  {{- end }}
  {{- end }}

  # Cookie Security
  WEBUI_SESSION_COOKIE_SECURE: {{ .Values.openWebui.config.cookieSecure | default "true" | quote }}

  # Audit Logging
  AUDIT_LOG_LEVEL: {{ .Values.openWebui.config.auditLogLevel | quote }}
  ENABLE_AUDIT_STDOUT: {{ .Values.openWebui.config.enableAuditStdout | default "true" | quote }}
  ENABLE_AUDIT_LOGS_FILE: {{ .Values.openWebui.config.enableAuditLogsFile | default "false" | quote }}
  # Structured logging (Loki-friendly)
  LOG_FORMAT: {{ .Values.openWebui.config.logFormat | default "json" | quote }}

  # User Archival
  ENABLE_USER_ARCHIVAL: {{ .Values.openWebui.config.enableUserArchival | quote }}
  DEFAULT_ARCHIVE_RETENTION_DAYS: {{ .Values.openWebui.config.defaultArchiveRetentionDays | quote }}

  # Storage Provider (S3)
  {{- if .Values.openWebui.config.storageProvider }}
  STORAGE_PROVIDER: {{ .Values.openWebui.config.storageProvider | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.s3BucketName }}
  S3_BUCKET_NAME: {{ .Values.openWebui.config.s3BucketName | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.s3RegionName }}
  S3_REGION_NAME: {{ .Values.openWebui.config.s3RegionName | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.s3EndpointUrl }}
  S3_ENDPOINT_URL: {{ .Values.openWebui.config.s3EndpointUrl | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.s3KeyPrefix }}
  S3_KEY_PREFIX: {{ .Values.openWebui.config.s3KeyPrefix | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.s3EnableTagging }}
  S3_ENABLE_TAGGING: {{ .Values.openWebui.config.s3EnableTagging | quote }}
  {{- end }}
  {{- if .Values.openWebui.config.s3VerifySsl }}
  S3_VERIFY_SSL: {{ .Values.openWebui.config.s3VerifySsl | quote }}
  {{- end }}

  # AWS SDK env vars (used by boto3 for S3). Default to values compatible with
  # S3-compatible providers that don't accept the newer AWS integrity checksums.
  {{- if eq (.Values.openWebui.config.storageProvider | default "") "s3" }}
  {{- if .Values.openWebui.config.s3RegionName }}
  AWS_REGION: {{ .Values.openWebui.config.s3RegionName | quote }}
  {{- end }}
  AWS_REQUEST_CHECKSUM_CALCULATION: {{ .Values.openWebui.config.s3ChecksumRequestMode | default "when_required" | quote }}
  AWS_RESPONSE_CHECKSUM_VALIDATION: {{ .Values.openWebui.config.s3ChecksumResponseMode | default "when_required" | quote }}
  {{- end }}

  # Redis / WebSocket coordination (required for replicaCount > 1). See
  # https://docs.openwebui.com/getting-started/advanced-topics/scaling/
  {{- if .Values.redis.enabled }}
  ENABLE_WEBSOCKET_SUPPORT: "true"
  WEBSOCKET_MANAGER: "redis"
  REDIS_URL: "redis://{{ include "open-webui-tenant.redis.fullname" . }}:6379/0"
  {{- end }}

  # Only the migration init container may upgrade the schema.
  ENABLE_DB_MIGRATIONS: "false"

  # Telemetry
  SCARF_NO_ANALYTICS: {{ .Values.openWebui.config.scarfNoAnalytics | quote }}
  DO_NOT_TRACK: {{ .Values.openWebui.config.doNotTrack | quote }}
  ANONYMIZED_TELEMETRY: {{ .Values.openWebui.config.anonymizedTelemetry | quote }}

  # Easter Eggs
  ENABLE_EASTER_EGGS: {{ .Values.openWebui.config.enableEasterEggs | quote }}

  # Custom Prompts
  {{- if .Values.openWebui.config.queryGenerationPromptTemplate }}
  QUERY_GENERATION_PROMPT_TEMPLATE: {{ .Values.openWebui.config.queryGenerationPromptTemplate | quote }}
  {{- end }}

  # OpenTelemetry Configuration
  {{- if .Values.openWebui.config.telemetry.otel.enabled }}
  ENABLE_OTEL: "true"
  ENABLE_OTEL_TRACES: {{ .Values.openWebui.config.telemetry.otel.traces | quote }}
  ENABLE_OTEL_METRICS: {{ .Values.openWebui.config.telemetry.otel.metrics | quote }}
  ENABLE_OTEL_LOGS: {{ .Values.openWebui.config.telemetry.otel.logs | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.openWebui.config.telemetry.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.openWebui.config.telemetry.otel.serviceName | quote }}
  OTEL_EXPORTER_OTLP_INSECURE: {{ .Values.openWebui.config.telemetry.otel.insecure | quote }}
  OTEL_TRACES_SAMPLER: {{ .Values.openWebui.config.telemetry.otel.sampler | quote }}
  OTEL_OTLP_SPAN_EXPORTER: {{ .Values.openWebui.config.telemetry.otel.protocol | quote }}
  # OTEL_RESOURCE_ATTRIBUTES is set on the Deployment, not here — it needs the
  # per-pod name (downward API) to give each HA replica a unique
  # service.instance.id. Any telemetry.otel.resourceAttributes value is
  # appended there.
  {{- end }}

  # Agent API (internal: routes chat UI to agent service)
  {{- if eq .Values.openWebui.config.agentApiEnabled "true" }}
  AGENT_API_ENABLED: "true"
  AGENT_API_AGENTS: {{ .Values.openWebui.config.agentApiAgents | default "" | quote }}
  {{- end }}

{{- end }}
