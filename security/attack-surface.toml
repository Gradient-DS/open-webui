name = "webhook_id"
prefix = "/api/events/webhooks/{webhook_id}"
description = "main.py:create_event_webhook returns upsert_event_webhook id. Disabled during fixture creation to avoid notification traffic."
unseedable = "main.py:create_event_webhook rejects every URL reachable from the sealed CI stack. upsert_event_webhook validates the target through retrieval/web/utils.py:validate_url, which refuses any host resolving to a non-global address unless ENABLE_LOCAL_WEB_FETCH is on. In-network hosts (stub, minio) resolve to private Docker addresses and are refused; external hosts do not resolve at all, because the network is internal:true with no DNS. Enabling ENABLE_LOCAL_WEB_FETCH would seed this parameter by disabling the SSRF guard the gate exists to observe, and would diverge from production, which leaves it unset (verified in soev-gitops and the chart, 2026-09-08). Recorded rather than worked around: this route is unseedable precisely because the guard works."

