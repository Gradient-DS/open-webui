  # ------------------------------------------------------------- pip-audit
  # nltk 3.10.3 is both the pinned and the newest release and the advisory
  # still lists it as affected, so there is nothing to upgrade to.
  - id: PYSEC-2026-3740
    package: nltk
    scanner: pip-audit
    reason: >-
      NLTK's model-artifact APIs bypass their own path checks and can touch
      files outside the allowed roots. 3.10.3 is both the pinned and the newest
      release, and the advisory lists it as still affected, so there is no
      version to upgrade to.
    replacement_considered: >-
      nltk is pulled in for sentence tokenisation behind langchain's text
      splitters. Replacing the splitter implementation would change how every
      existing document was chunked and would invalidate stored embeddings, so
      it is not a change a security-scanning rollout can make safely.
    usage_analysis: >-
      The affected APIs download and unpack NLTK model artifacts. This image
      downloads exactly one artifact, punkt_tab, at build time from NLTK's own
      distribution, and the runtime never calls a download or unpack API — user
      input reaches only the tokenizer, not the artifact loader.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-12-01

  - id: CVE-2026-69112
    package: accelerate
    scanner: pip-audit
    reason: >-
      Path traversal in load_checkpoint_in_model and load_checkpoint_and_dispatch,
      which read weight_map entries from sharded checkpoint indexes. No fix
      version has been published. Neither function is called anywhere in this
      repository, and the package is not installed in the image we ship:
      requirements-slim.txt drops accelerate, and both the release build
      (docker-build-soev.yaml) and the image scanned by this suite set
      USE_SLIM=true. pip-audit flags it because it reads requirements.txt as a
      source manifest, not because the artefact contains it.
    replacement_considered: >-
      No upgrade exists. Removing accelerate from requirements.txt was
      considered and rejected: that file is the CUDA/CPU image's manifest and is
      inherited from upstream, which pins the identical version. Diverging there
      would create a permanent merge conflict for a package our own builds
      already exclude.
    usage_analysis: >-
      grep for imports across backend/open_webui finds none; the single textual
      match is S3_USE_ACCELERATE_ENDPOINT, an unrelated S3 transfer setting.
      Verified absent from the running slim container.
    approved_by: Lex Lubbers, 2026-09-09
    recheck: 2026-12-09


  # pymongo 4.18.1 (published 2026-09-10) is taken above and closes
  # CVE-2026-88029. The three below are fixed only in 4.18.2, published
  # 2026-09-24, which the 14-day uv exclude-newer cooldown refuses until
  # 2026-10-08. NOT a §7 exception — a DEFERRED UPGRADE: on or after
  # 2026-10-08 bump pymongo to 4.18.2 in pyproject.toml, uv.lock and both
  # requirements files and delete these three entries. recheck 2026-10-20 is
  # the deadline for that.
  # Keyed by GHSA alias (pip-audit matches aliases) because ids must be unique
  # across scanners and the image scan reports the CVE ids; see the trivy
  # entries below.
  - id: GHSA-qx36-8mw2-4r3x
    package: pymongo
    scanner: pip-audit
    reason: >-
      CVE-2026-96747. PyMongo passed a client-side-encryption data key's KMS
      endpoint verbatim into parse_host(), which accepts any string ending in
      .sock as a Unix socket path instead of validating it as a hostname.
      Fixed in 4.18.2, which is inside the 14-day package cooldown until
      2026-10-08.
    replacement_considered: >-
      No replacement is needed; this is a deferred upgrade. 4.18.1, the newest
      release outside the cooldown, is pinned now. Exempting pymongo from the
      cooldown to take 4.18.2 early was rejected: the cooldown is the
      supply-chain control, and the package is not used (see usage_analysis).
    usage_analysis: >-
      Unreachable. Nothing under backend/ imports pymongo, bson or gridfs; the
      pin is inherited from upstream's requirements and pyproject `all` extra.
      No code path creates a MongoClient, so no client-side-encryption data key
      or KMS endpoint is ever parsed.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-10-20

  - id: GHSA-vp6j-j7w5-5xjj
    package: pymongo
    scanner: pip-audit
    reason: >-
      CVE-2026-96748. PyMongo percent-decoded the whole host section of a
      connection string before splitting it into host:port entries, so an
      encoded comma or colon in a hostname could redirect the connection.
      Fixed in 4.18.2, which is inside the 14-day package cooldown until
      2026-10-08.
    replacement_considered: >-
      Same deferred upgrade as CVE-2026-96747: 4.18.1 is pinned now, 4.18.2
      replaces it once it clears the cooldown.
    usage_analysis: >-
      Unreachable. No code under backend/ imports pymongo or parses a MongoDB
      connection string, and no deployment configures one.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-10-20

  - id: GHSA-v4x9-3549-crwv
    package: pymongo
    scanner: pip-audit
    reason: >-
      CVE-2026-96749. Integer overflow in the BSON encoder of PyMongo's
      bundled C extension when a single document is built from an unusually
      large input. Fixed in 4.18.2, which is inside the 14-day package
      cooldown until 2026-10-08.
    replacement_considered: >-
      Same deferred upgrade as CVE-2026-96747: 4.18.1 is pinned now, 4.18.2
      replaces it once it clears the cooldown.
    usage_analysis: >-
      Unreachable. Nothing under backend/ imports bson or pymongo, so the C
      encoder is never invoked on any input, attacker-controlled or otherwise.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-10-20

