# --- Singletons -----------------------------------------------------------------

[[waived]]
id = "GET /api/v1/auths/password/reset/{token}/validate"
reason = "Never attempted: every owner pass skips it because `token` is declared unseedable (attack-surface.toml, key reset_token). auths.py:forgot_password stores only a hash and sends the raw token by email, the response is deliberately generic, and the plane reads neither mail nor the database. Closes with a mail sink on the CI network that the plane can read."

[[waived]]
id = "GET /openai/models/{url_idx}/download/status/{job_id}"
reason = "Never attempted: every owner pass skips it because `job_id` is declared unseedable (attack-surface.toml, key model_download_job). routers/openai.py:get_provider_model_download_status reads a job an actual provider model download created; the CI stub serves model metadata but has no download-job lifecycle. Closes when the stub grows one."

[[waived]]
id = "GET /api/v1/files/{id}/attachments/{attachment_id}"
reason = "Removed in chore/remove-file-attachment-route. Never attempted meanwhile: `attachment_id` is unseedable (attack-surface.toml, key attachment) because nothing creates render attachments any more."

[[waived]]
id = "GET /cache/{path}"
reason = "Never attempted: `path` is unseedable (attack-surface.toml, key cache). The only cache file the API creates is a data export, and services/export/service.py reads knowledge through soev-api, so the export fails without it. Closes when the export works without soev-api or another route writes a cache file."

