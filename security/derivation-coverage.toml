id = "POST /api/v1/configs/import"
reason = "ImportConfigForm wraps an arbitrary exported configuration blob in config; the handler passes its free-form keys and values to Config.upsert. No fixed exported shape can be enumerated here. Keep this waived unless a versioned import contract is introduced or the corpus can seed arbitrary map entries."

[[waived]]
id = "POST /api/v1/configs/integrations"
reason = "Provider values are typed by IntegrationsConfigBody, but providers is keyed by administrator-defined slugs. The derivation deliberately skips additionalProperties, so even known provider fields are unreachable. Future coverage needs map-key seeding in both derivation and payload construction; do not fabricate provider slugs."

