    replacement_considered: >-
      Identical to the entry above: upstream history, file long since removed.
    usage_analysis: >-
      Identical to the entry above. No credential exists.
    approved_by: "@LexLubbers"
    recheck: 2026-12-01

  - id: 58a13aec7e14637a9d50d781e3f24c7f0747c292:static/pyscript/xterm-DqawCVsv.js:generic-api-key:1
    package: frontend-vendor
    scanner: gitleaks
    reason: >-
      False positive, inherited from upstream open-webui. A minified,
      single-line vendored build of the xterm.js terminal emulator contains a
      long alphanumeric run that the generic-api-key heuristic matched. It is
      minifier output, not a credential.
    replacement_considered: >-
      No dependency change helps: any minified bundle of comparable size trips
