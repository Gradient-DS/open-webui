name: E2E Tests

on:
  pull_request:
    branches:
      - test
      - main

# Cancel a superseded run of the same pull request; never cancel anything else.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-tests:
    name: Migration Tests (SQLite + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The fork ships no chromadb (#274), so the upstream default VECTOR_DB=chroma
    # cannot start; boot against Weaviate, the store the tenants run.
    env:
      VECTOR_DB: weaviate
      ENABLE_WEAVIATE_MULTITENANCY_MODE: 'true'
      WEAVIATE_HTTP_HOST: localhost
      WEAVIATE_HTTP_PORT: '8090'
      WEAVIATE_GRPC_HOST: localhost
      WEAVIATE_GRPC_PORT: '50051'
    services:
      weaviate:
        image: semitechnologies/weaviate:1.35.0
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          DEFAULT_VECTORIZER_MODULE: none
          ENABLE_MODULES: ''
          DISABLE_TELEMETRY: 'true'
          CLUSTER_HOSTNAME: node1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/v1/.well-known/ready"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 8090:8080
          - 50051:50051
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r backend/requirements.txt
          uv pip install psycopg2-binary

      - name: Test backend startup with SQLite
        id: sqlite
        env:
          WEBUI_SECRET_KEY: secret-key
          GLOBAL_LOG_LEVEL: debug
        run: |
          source .venv/bin/activate
          cd backend
          uvicorn open_webui.main:app --port "8080" --forwarded-allow-ips '*' &
          UVICORN_PID=$!
          for i in {1..120}; do
              curl -s http://localhost:8080/api/config > /dev/null && break
              sleep 1
              if [ $i -eq 120 ]; then
                  echo "Server failed to start"
                  kill -9 $UVICORN_PID
                  exit 1
              fi
          done
          sleep 5
          if ! kill -0 $UVICORN_PID; then
              echo "Server has stopped"
              exit 1
          fi
          kill $UVICORN_PID || true

      - name: Test backend startup with Postgres
        if: success() || steps.sqlite.conclusion == 'failure'
        env:
          WEBUI_SECRET_KEY: secret-key
          GLOBAL_LOG_LEVEL: debug
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_POOL_SIZE: 10
          DATABASE_POOL_MAX_OVERFLOW: 10
          DATABASE_POOL_TIMEOUT: 30
        run: |
          source .venv/bin/activate
          cd backend
          uvicorn open_webui.main:app --port "8081" --forwarded-allow-ips '*' &
          UVICORN_PID=$!
          for i in {1..120}; do
              curl -s http://localhost:8081/api/config > /dev/null && break
              sleep 1
              if [ $i -eq 120 ]; then
                  echo "Server failed to start"
                  kill -9 $UVICORN_PID
                  exit 1
              fi
          done
          sleep 5
          if ! kill -0 $UVICORN_PID; then
              echo "Server has stopped"
              exit 1
          fi

          # Verify DB reconnection after connection drop
          status_code=$(curl --write-out %{http_code} -s --output /dev/null http://localhost:8081/health/db)
          if [[ "$status_code" -ne 200 ]]; then
            echo "Server failed before postgres reconnect check"
            exit 1
          fi

          echo "Terminating all connections to postgres..."
          python -c "import os, psycopg2 as pg2; \
            conn = pg2.connect(dsn=os.environ['DATABASE_URL'].replace('+pool', '')); \
            cur = conn.cursor(); \
            cur.execute('SELECT pg_terminate_backend(psa.pid) FROM pg_stat_activity psa WHERE datname = current_database() AND pid <> pg_backend_pid();')"

          status_code=$(curl --write-out %{http_code} -s --output /dev/null http://localhost:8081/health/db)
          if [[ "$status_code" -ne 200 ]]; then
            echo "Server has not reconnected to postgres: returned status $status_code"
            exit 1
          fi
