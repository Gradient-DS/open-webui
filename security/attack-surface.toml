# Sharing by design
#
# Second-account answers the crossuser pass would report, which the application
# serves to every verified user on purpose. Each declaration names the route,
# the violation kinds it allows (owner-marker, resource-id, same-object, write;
# an unrefused administrator operation is never sharing) and why. Anything else
# the pass sees on the route is still a violation.

