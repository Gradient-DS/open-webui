# [Gradient] Pass the secrets that scripts/op-run resolves from secrets.env into the
# container (a bare name copies the value from the calling environment):
#   scripts/op-run docker compose -f docker-compose.yaml -f docker-compose.secrets.yaml up -d
# Keep the list in step with secrets.env.
services:
  open-webui:
    environment:
      - WEBUI_SECRET_KEY
      - WEBUI_ADMIN_PASSWORD
      - DATABASE_PASSWORD
      - MICROSOFT_CLIENT_SECRET
      - OPENAI_API_KEY
      - OPENAI_API_KEYS
      - RAG_OPENAI_API_KEY
      - IMAGES_OPENAI_API_KEY
      - EXTERNAL_DOCUMENT_LOADER_API_KEY
      - CONFLUENCE_BASIC_AUTH_API_TOKEN
      - LOADER_INGEST_API_KEY
      - PIPELINE_API_KEY
      - SYNC_API_KEY
      - SYNC_DAEMON_API_KEY
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
