# Request fields -- body or query -- that must carry a real id for the handler to
# get past its lookup. A random string reads 404 ("not found") and the route is
# driven without being entered: 17 routes measured exactly that. Values name
# seeded parameter keys ({file}, {knowledge}) or the pass token ({token}).
#
# The seeding pass plants `json` onto the all-fields body's skeleton and holds
# those fields there, as it holds constrained ones: the body that earns coverage
# carries the real id, and each held field is still probed alone with the
# corpus. The drive pass sends `params`. `setup` is a list of non-destructive
# requests made while resolving, for a fixture no path parameter owns.
#
# Multipart routes declare `files`, in the file seed's own format, and `form`
# text parts; the drive pass sends them. The derivation models JSON bodies only,
# so without these no pass sends a body and the route reads 422 in every pass.

