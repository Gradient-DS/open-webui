# --- Event webhooks: unseedable because the SSRF guard works -----------------
# These should outlive the others. Seeding them means switching the guard off.

[[waived]]
id = "PUT /api/events/webhooks/{webhook_id}"
reason = "Never attempted: every owner pass skips it because `webhook_id` is declared unseedable (attack-surface.toml, key event_webhook). main.py:create_event_webhook validates the target with retrieval/web/utils.py:validate_url, which refuses every in-network host (private Docker addresses), and external hosts do not resolve on the internal network. ENABLE_LOCAL_WEB_FETCH would seed it by disabling the SSRF guard, and production leaves it unset. Does not close: the route is unseedable because the guard works."

[[waived]]
id = "DELETE /api/events/webhooks/{webhook_id}"
reason = "Never attempted: every owner pass skips it because `webhook_id` is declared unseedable (attack-surface.toml, key event_webhook). main.py:create_event_webhook validates the target with retrieval/web/utils.py:validate_url, which refuses every in-network host (private Docker addresses), and external hosts do not resolve on the internal network. ENABLE_LOCAL_WEB_FETCH would seed it by disabling the SSRF guard, and production leaves it unset. Does not close: the route is unseedable because the guard works."

