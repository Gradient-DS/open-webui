{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-webui-tenant.fullname" . }}-isolation
  labels:
    {{- include "open-webui-tenant.labels" . | nindent 4 }}
spec:
  {{- if not (has .Values.networkPolicy.scope (list "namespace" "release")) }}
  {{- fail "networkPolicy.scope must be namespace or release" }}
  {{- end }}
  {{- if eq .Values.networkPolicy.scope "release" }}
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  {{- else }}
  podSelector: {}
  {{- end }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from observability namespace (for metrics scraping by Alloy/Prometheus)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.namespace | default "observability" }}
      ports:
        - protocol: TCP
          port: 9090   # Prometheus metrics
        - protocol: TCP
          port: 8080   # Common metrics port
    # Allow internal communication within namespace
    - from:
        - podSelector: {}
  egress:
    {{- include "open-webui-tenant.validateEgress" . }}
    {{- if .Values.networkPolicy.egress.strict }}
    {{- include "open-webui-tenant.releaseEgress" . | nindent 4 }}
    {{- include "open-webui-tenant.egressAllow" (list . .Values.networkPolicy.egress.allow) | nindent 4 }}
    {{- if .Values.openWebui.config.telemetry.otel.enabled }}
    # OTLP to the collector in the observability namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.namespace | default "observability" }}
      ports:
        - protocol: TCP
          {{- $otlpHost := (urlParse .Values.openWebui.config.telemetry.otel.endpoint).host }}
          port: {{ if contains ":" $otlpHost }}{{ splitList ":" $otlpHost | last }}{{ else }}4317{{ end }}
    {{- end }}
    {{- else }}
    # Allow to shared services namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sharedServices.namespace }}
    {{- range .Values.networkPolicy.extraEgressNamespaces }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    {{- if .Values.openWebui.config.telemetry.otel.enabled }}
    # Allow to observability namespace for OTEL
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.namespace | default "observability" }}
    {{- end }}
    # Allow internal communication within namespace
    - to:
        - podSelector: {}
    {{- end }}
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if not .Values.networkPolicy.egress.fqdn.enforce }}
    # Public internet: OIDC, cloud sources, object storage, web fetch
    {{- include "open-webui-tenant.publicEgress" . | nindent 4 }}
    {{- end }}
{{- end }}
