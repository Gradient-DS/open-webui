# Derivation gaps measured from committed security/openapi.json using openapi-surface.
# Phase 4b audited all 27 previously labelled untyped JSON write bodies.
# 7 blind body operations remain: 5 JSON writes, no JSON reads, 2 multipart.
# The writes include typed boolean-only bodies and user/agent-defined maps
# whose dynamic keys the derivation deliberately does not traverse.
# Exact set equality in test_writable_fields.py rejects missing or stale waivers.
# Known fields in open objects are not exhaustive coverage of extension data.

[[waived]]
id = "POST /api/v1/cloud-sync/connections/{connection_id}/authorize"
reason = "AuthorizationForm declares a single boolean flag selecting silent consent; there is no string field to plant."

[[waived]]
id = "POST /api/v1/folders/{id}/update/expanded"
reason = "FolderIsExpandedForm already declares only is_expanded (boolean). There are no named string leaves for the string-only corpus; further body typing would not help. Revisit if string fields are added or the corpus supports boolean/integer values."

[[waived]]
id = "POST /api/v1/audio/transcriptions"
reason = "Multipart file upload: file contents are a different surface that the hostile corpus does not model."

[[waived]]
id = "POST /api/v1/files/"
reason = "Multipart file upload: file contents are a different surface that the hostile corpus does not model."

[[waived]]
id = "POST /api/v1/users/user/variables/update"
reason = "UserVariablesForm declares `variables: dict` (routers/users.py:634-635) -- free-form key/value chosen by the user, not a shape the derivation can enumerate. Same class as the tool and function valve bodies. Typing it would mean inventing keys that do not exist."


# MeetingInput is already typed as input: dict[str, JsonValue]. The meeting
# agent owns the dynamic input schema; OWUI forwards it without inventing keys.
[[waived]]
id = "POST /api/v1/meetings"
reason = "MeetingInput.input is a typed dynamic JsonValue map. The string-field derivation does not traverse additionalProperties; exercising agent-defined keys needs a meeting-agent schema and map-key seeding, not fictitious fixed OWUI fields."

[[waived]]
id = "POST /api/v1/meetings/{meeting_id}/inputs"
reason = "MeetingInput.input is the same typed dynamic JsonValue map used to start a meeting. Its keys belong to the meeting agent; the fixed-field derivation cannot enumerate them. Revisit when the corpus supports map-key seeding against the agent schema."
