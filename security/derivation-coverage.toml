# MeetingInput is already typed as input: dict[str, JsonValue]. The meeting
# agent owns the dynamic input schema; OWUI forwards it without inventing keys.
[[waived]]
id = "POST /api/v1/meetings"
reason = "MeetingInput.input is a typed dynamic JsonValue map. The string-field derivation does not traverse additionalProperties; exercising agent-defined keys needs a meeting-agent schema and map-key seeding, not fictitious fixed OWUI fields."

[[waived]]
id = "POST /api/v1/meetings/{meeting_id}/inputs"
reason = "MeetingInput.input is the same typed dynamic JsonValue map used to start a meeting. Its keys belong to the meeting agent; the fixed-field derivation cannot enumerate them. Revisit when the corpus supports map-key seeding against the agent schema."
