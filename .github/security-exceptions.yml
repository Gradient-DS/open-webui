  # ------------------------------------------------------------- pip-audit
  # nltk 3.10.3 is both the pinned and the newest release and the advisory
  # still lists it as affected, so there is nothing to upgrade to.
  - id: PYSEC-2026-3740
    package: nltk
    scanner: pip-audit
    reason: >-
      NLTK's model-artifact APIs bypass their own path checks and can touch
      files outside the allowed roots. 3.10.3 is both the pinned and the newest
      release, and the advisory lists it as still affected, so there is no
      version to upgrade to.
    replacement_considered: >-
      nltk is pulled in by unstructured, which uses it for sentence/word
      tokenisation and POS tagging during document parsing. unstructured cannot
      be configured without it, and replacing unstructured would change how
      every existing document was parsed and chunked.
    usage_analysis: >-
      The affected APIs (TransitionParser.train/parse, AveragedPerceptron
      save/load, PerceptronTagger.save_to_json, save_maxent_params) read or
      write model files at a caller-chosen path, bypassing nltk's opt-in
      pathsec sandbox. The backend never imports nltk; unstructured only calls
      sent_tokenize, word_tokenize and pos_tag, which load models from nltk's
      fixed data directories. No code path lets user input choose
      a model import or export path, and we do not rely on pathsec.
    approved_by: "@LexLubbers"
    recheck: 2026-12-01

  # nltk 3.10.4 fixes the finding below but was published 2026-10-21, inside
  # the 14-day package minimum age. Upgrade and delete this entry once it ages
  # out on 2026-11-04.
  - id: GHSA-j456-xh4h-cpf2
    package: nltk
    scanner: trivy
    reason: >-
      High, no CVE id. WekaClassifier hands a caller-controlled model path to
      the weka JVM without nltk's pathsec containment check. The only fixed
      release, 3.10.4, is younger than the 14-day minimum package age, so
      3.10.3 stays pinned until then. Reported by the image scan only.
    replacement_considered: >-
      nltk is pulled in by unstructured for tokenisation and POS tagging;
      replacing unstructured would change how every existing document is
      parsed and chunked. Waiting out the age window is the smaller step.
    usage_analysis: >-
      Unreachable. The backend never imports nltk, and unstructured only calls
      sent_tokenize, word_tokenize and pos_tag. Nothing imports
      nltk.classify.weka, the image ships no weka JVM, and no code path lets
      user input choose a model path.
    approved_by: "@LexLubbers, 2026-10-28"
    recheck: 2026-11-05

  - id: CVE-2026-69112
    package: accelerate
    scanner: pip-audit
    reason: >-
      Path traversal in load_checkpoint_in_model and load_checkpoint_and_dispatch,
      which read weight_map entries from sharded checkpoint indexes. No fix
      version has been published. Neither function is called anywhere in this
      repository, and the package is not installed in the image we ship:
      requirements-slim.txt drops accelerate, and both the release build
      (docker-build-soev.yaml) and the image scanned by this suite set
      USE_SLIM=true. pip-audit flags it because it reads requirements.txt as a
      source manifest, not because the artefact contains it.
    replacement_considered: >-
      No upgrade exists. Removing accelerate from requirements.txt was
      considered and rejected: that file is the CUDA/CPU image's manifest and is
      inherited from upstream, which pins the identical version. Diverging there
      would create a permanent merge conflict for a package our own builds
      already exclude.
    usage_analysis: >-
      grep for imports across backend/open_webui finds none; the single textual
      match is S3_USE_ACCELERATE_ENDPOINT, an unrelated S3 transfer setting.
      Verified absent from the running slim container.
    approved_by: Lex Lubbers, 2026-09-09
    recheck: 2026-12-09

  # filelock 4.2.1 fixes the three findings below, but every unstructured
  # release up to 0.27.34 (2026-10-22) declares filelock<4.0.0, and the 3.x line
  # has no backport. pip-audit resolves requirements.txt with pip, which cannot
  # override that cap. Upgrade and delete all four entries once unstructured
  # allows filelock 4.
  - id: GHSA-v4x8-3wr5-3wq8
    package: filelock
    scanner: pip-audit
    reason: >-
      CVE-2026-112940 (high); pip-audit matches this id against the advisory's
      aliases, so the CVE id stays free for the trivy entry below. filelock.ReadWriteLock and AsyncReadWriteLock
      hand SQLite a path it reopens by name, so another local user who can
      write in the lock directory can redirect its side files. Fixed only in
      4.2.1, which unstructured's declared filelock<4.0.0 excludes.
    replacement_considered: >-
      Replacing unstructured would change how every existing document is
      parsed and chunked. Forcing filelock 4 past unstructured's cap needs a
      resolver override that pip, which this audit resolves with, does not
      support.
    usage_analysis: >-
      The backend never imports filelock. It arrives through huggingface-hub,
      torch, datasets and unstructured, which use FileLock and, as a
      fallback, SoftFileLock; none of them uses ReadWriteLock or
      AsyncReadWriteLock (chromadb's ReadWriteLock is its own class). The
      container runs a single unprivileged user, so there is no second local
      account to plant files.
    approved_by: "@LexLubbers (pending, review on PR #523)"
    recheck: 2026-11-07

  - id: CVE-2026-112940
    package: filelock
    scanner: trivy
    reason: >-
      The same finding as the pip-audit entry above, reported by the image
      scan. See that entry.
    replacement_considered: >-
      Same as the pip-audit entry above.
    usage_analysis: >-
      Same as the pip-audit entry above.
    approved_by: "@LexLubbers (pending, review on PR #523)"
    recheck: 2026-11-07

  - id: CVE-2026-112913
    package: filelock
    scanner: pip-audit
    reason: >-
      GHSA-9vhv-jxww-xfm5 (low). Windows only: ReadWriteLock acts on SQLite
      side files another local user places beside its database.
    replacement_considered: >-
      Same capped upgrade as CVE-2026-112940.
    usage_analysis: >-
      Unreachable: we ship Linux images only, and nothing uses ReadWriteLock.
    approved_by: "@LexLubbers (pending, review on PR #523)"
    recheck: 2026-11-07

  - id: CVE-2026-112907
    package: filelock
    scanner: pip-audit
    reason: >-
      GHSA-567q-5qvw-pf92 (low). Windows only: an oplock on a soft lock's marker
      stalls SoftFileLock.acquire() past its timeout.
    replacement_considered: >-
      Same capped upgrade as CVE-2026-112940.
    usage_analysis: >-
      Unreachable: oplocks are a Windows mechanism, and we ship Linux images
