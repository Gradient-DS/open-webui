{{- if and .Values.networkPolicy.egress.strict .Values.soevApi.url (not .Values.soevApi.transferStoreHost) -}}
{{- fail "soevApi.transferStoreHost is required with strict egress and a configured platform URL" -}}
{{- end -}}
{{- if eq .Values.openWebui.config.vectorDb "pgvector" -}}
{{- if .Values.weaviate.enabled -}}
{{- fail "set weaviate.enabled=false when vectorDb is pgvector" -}}
{{- end -}}
{{- if ne .Values.openWebui.config.databaseUser .Values.postgres.user -}}
{{- fail "when openWebui.config.vectorDb is pgvector, set openWebui.config.databaseUser to match postgres.user" -}}
{{- end -}}
{{- if ne .Values.openWebui.config.databaseName .Values.postgres.database -}}
{{- fail "when openWebui.config.vectorDb is pgvector, set openWebui.config.databaseName to match postgres.database" -}}
{{- end -}}
{{- end -}}

{{- with .Values.postgres.migration -}}
{{- if .user -}}
{{- if or (empty .passwordSecretRef.name) (empty .passwordSecretRef.key) -}}
{{- fail "postgres.migration.user requires postgres.migration.passwordSecretRef.name and key" -}}
{{- end -}}
{{- if and .role (not (regexMatch "^[A-Za-z_][A-Za-z0-9_$-]*$" .role)) -}}
{{- fail "postgres.migration.role must be a single PostgreSQL role name without whitespace or option syntax" -}}
{{- end -}}
{{- else if or .role .passwordSecretRef.name .passwordSecretRef.key -}}
{{- fail "postgres.migration.role and passwordSecretRef require postgres.migration.user" -}}
{{- end -}}
{{- end -}}
