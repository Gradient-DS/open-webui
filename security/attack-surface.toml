via = "POST /api/v1/auths/add"
body = { "email" = "attack-fixture-{token}@example.com", "name" = "Attack fixture {token}", "password" = "Attack-Fixture-Passw0rd!", "role" = "user" }
extract = "id"
actor = "admin"

