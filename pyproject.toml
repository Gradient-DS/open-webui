[project]
name = "open-webui"
description = "Open WebUI"
authors = [
    { name = "Timothy Jaeryang Baek", email = "tim@openwebui.com" }
]
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.31", # security: CVE-2026-53538/53539/53540 (form-parsing DoS + param smuggling) fixed in 0.0.31
    "itsdangerous==2.2.0",

    "python-socketio==5.16.2", # security: CVE-2026-48804 (binary attachment accumulation memory exhaustion) fixed in 5.16.2
    "cryptography==50.0.0", # security: CVE-2026-69248/69249 (X.509 wildcard name-constraint escape, chain-building DoS) fixed in 49.0.0; CVE-2026-69247 (PKCS7 Bleichenbacher oracle) fixed in 50.0.0
    "bcrypt==5.0.0",
    "argon2-cffi==25.1.0",
    "PyJWT[crypto]==2.13.0",
    "authlib==1.7.2",

    "requests==2.34.2",
    "aiohttp==3.14.3", # do not update to 3.13.3 - broken; security: CVE-2026-59881/69243 (ws decompress, request smuggling) fixed in 3.14.2; CVE-2026-69244 (OOB heap read in C response parser) fixed in 3.14.3
    "async-timeout==5.0.1",
    "aiocache==0.12.3",
    "aiofiles==25.1.0",
    "starlette-compress==1.7.1",
    "Brotli==1.2.0",
    "brotlicffi==1.2.0.1",
    "httpx[socks,http2,zstd,cli,brotli]==0.28.1",
    "starsessions[redis]==2.2.1",
    "python-mimeparse==2.0.0",

    "sqlalchemy[asyncio]==2.0.50",
    "aiosqlite==0.22.1",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.4",

    "pycrdt==0.13.1",
    "redis==8.0.0",
    # "valkey-glide-sync==2.3.1",  # optional: install manually if VECTOR_DB=valkey

    "pytz==2026.2",
    "APScheduler==3.11.2",
    "RestrictedPython==8.3", # security: CVE-2026-55830 (guard hooks can be shadowed)

    "loguru==0.7.3",
    "asgiref==3.11.1",

    "tiktoken==0.13.0",
    "mcp==1.28.1", # security: CVE-2026-59950 (WebSocket server transport missing Host/Origin validation, transport unused by us) fixed in 1.28.1

    "openai==2.29.0",
    "anthropic==0.86.0",
    "google-genai==1.66.0",

    "langchain==1.3.9", # security: GHSA-gr75-jv2w-4656 (path traversal in file-search middleware, unused by us) fixed in 1.3.9
    "langchain-community==0.4.2",
    "langchain-classic==1.0.7",
    "langchain-text-splitters==1.1.2",

    "fake-useragent==2.2.0",
    "opensearch-py==3.2.0",
    "PyMySQL==1.2.0",
    "boto3==1.42.62",

    "transformers==5.11.0", # security: CVE-2026-9856 (GHSA-xrqw-3rrv-vx5w, save_pretrained path traversal via chat template names) fixed in 5.10.0, which was yanked upstream — 5.11.0 is the first usable fixed release
    "sentence-transformers==5.5.1",
    "accelerate==1.13.0",
    "pyarrow==23.0.1", # security: PYSEC-2026-113 (Apache Arrow C++ use-after-free) fixed in 23.0.1; was pinned to 20 for rpi #15897 — verify rpi build before backporting
    "einops==0.8.2",

    "ftfy==6.3.1",
    "chardet==7.4.3",
    "pypdf==6.16.1", # security: CVE-2026-84309 (infinite loop in TreeObject.insert_child) fixed in 6.16.0; CVE-2026-84310/84311 (unbounded runtime/memory retrieving outlines and extracting XForm objects) fixed in 6.16.1 (prior CVE-2026-71852/71870 + CVE-2026-59935/59936/59937/59938/48735/49460/49461/54530/54531 + GHSA-jm82-fx9c-mx94 fixes stay fixed)
    "fpdf2==2.8.7",
    "pymdown-extensions==11.0.1", # security: CVE-2026-61632 fixed in 11.0 (prior CVE-2026-46338 snippets path traversal fix stays fixed)
    "docx2txt==0.9",
    "python-pptx==1.0.2",
    "msoffcrypto-tool==6.0.0",
    "python-magic==0.4.27", # magic-byte upload sniffing (utils/upload_guard.py); needs libmagic1
    "nltk==3.10.3", # security: CVE-2026-54293 (path traversal) + PYSEC-2026-3582..3741 (ReDoS/DoS)
    "Markdown==3.10.2",
    "beautifulsoup4==4.14.3",
    "pypandoc==1.17",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
    "pyxlsb==1.0.10",
    "xlrd==2.0.2",
    "validators==0.35.0",
    "psutil==7.2.2",
    "sentencepiece==0.2.1",
    "soundfile==0.13.1",
    "azure-ai-documentintelligence==1.0.2",

    "pillow==12.3.0", # security: CVE-2026-54058/59197/59199/59200/59204/59205 + 4 more (DoS/heap OOB via crafted images) fixed in 12.3.0
    "opencv-python-headless==4.13.0.92",
    "rapidocr-onnxruntime==1.4.4",
    "rank-bm25==0.2.2",

    "onnxruntime==1.26.0",
    "faster-whisper==1.2.1",

    "black==26.5.1",
    "youtube-transcript-api==1.2.4",
    "pytube==15.0.0",

    "pydub==0.25.1",
    "ddgs==9.14.4",

    "google-api-python-client==2.197.0",
    "google-auth-httplib2==0.4.0",
    "google-auth-oauthlib==1.4.0",

    "googleapis-common-protos==1.75.0",
    "google-cloud-storage==3.9.0",

    "azure-identity==1.25.3",
    "azure-storage-blob==12.29.0",

    "ldap3==2.9.1",

    "pyotp==2.9.0",
    "qrcode[pil]==8.0",
]
readme = "README.md"
requires-python = ">= 3.11, < 3.13.0a1"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary==2.9.12",
    "pgvector==0.4.2",
]
mariadb = [
    "mariadb==1.1.14",
]
unstructured = [
    "unstructured==0.24.1", # security: CVE-2026-71428 (SSRF via url= partitioning) fixed in 0.24.0; was 0.22.31
]

all = [
    "pymongo==4.17.0",
    "psycopg2-binary==2.9.12",
    "pgvector==0.4.2",
    "moto[s3]>=5.0.26",
    "gcp-storage-emulator>=2024.8.3",
    "docker~=7.1.0",
    "pytest>=9.0.3,<10",
    "pytest-docker~=3.2.5",
    "playwright==1.60.0", # Caution: version must match docker-compose.playwright.yaml - Update the docker-compose.yaml if necessary
    "elasticsearch==9.4.1",

    "qdrant-client==1.18.0",

    "weaviate-client==4.20.3",
    "pymilvus==2.6.14",
    "pinecone==6.0.2",
    "oracledb==3.4.2",
    "colbert-ai==0.2.22",

    "azure-search-documents==12.0.0",
    "unstructured==0.24.1", # security: CVE-2026-71428 (SSRF via url= partitioning) fixed in 0.24.0; was 0.22.31
]

soev = [
    "hostile-corpus @ https://github.com/Gradient-DS/.github/archive/1fb8c12d75bdb42ac5313ec405a502bcaa4b3cc3.tar.gz#subdirectory=packages/hostile-corpus",
    "openapi-surface @ https://github.com/Gradient-DS/.github/archive/84000662a5bd08ce56468ede3b38e1563039492b.tar.gz#subdirectory=packages/openapi-surface",
    "pytest-asyncio>=1.0.0",
    "weaviate-client==4.20.3",
    "psycopg2-binary==2.9.12",
    "python-dotenv>=1.0.0",
    "playwright==1.60.0",
]

[project.scripts]
open-webui = "open_webui:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "package.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.hooks.custom]  # keep this for reading hooks from `hatch_build.py`

[tool.uv]
# Minimum third-party package release age: blocks newly-published (and
# potentially compromised/yanked) versions from being resolved. Lock
# regeneration is the rollback — any package whose only <14-day version is
# a security fix should be exempted here explicitly via
# exclude-newer-package, with a comment.
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
# Security-fix exemption (2026-08-04): cryptography 50.0.0 (published
# 2026-07-31) is the only release fixing CVE-2026-69247/69248/69249 — see the
# pin comment in [project.dependencies]. Remove this exemption once 50.0.0 ages
# past the 14-day window on 2026-08-14.
# (The aiohttp 3.14.3 exemption added alongside it was dropped 2026-08-11:
# 3.14.3 was published 2026-07-23 and has aged out, so it resolves without one.)
cryptography = false

[tool.hatch.build.targets.wheel]
sources = ["backend"]
exclude = [
    ".dockerignore",
    ".gitignore",
    ".webui_secret_key",
    "dev.sh",
    "requirements.txt",
    "start.sh",
    "start_windows.bat",
    "webui.db",
    "chroma.sqlite3",
]
force-include = { "CHANGELOG.md" = "open_webui/CHANGELOG.md", build = "open_webui/frontend" }

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.svg,package-lock.json,i18n,*.lock,*.css,*-bundle.js,locales,example-doc.txt,emoji-shortcodes.json'
check-hidden = true
# ignore-regex = ''
ignore-words-list = 'ans'

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.5",
]

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false
# ruff >=0.16 formats Python code blocks inside Markdown by default; our .md files
# (thoughts/, docs/, .claude/, collab/) contain illustrative snippets that must not churn.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "C90",  # mccabe
  "ICN",  # flake8-import-conventions
]

# Plugin configs:
flake8-import-conventions.banned-from = [ "ast", "datetime" ]
flake8-import-conventions.aliases = { datetime = "dt" }
mccabe.max-complexity = 10
pydocstyle.convention = "google"
