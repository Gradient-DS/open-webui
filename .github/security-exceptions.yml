  # ------------------------------------------------------------- pip-audit
  # nltk 3.10.3 is both the pinned and the newest release and the advisory
  # still lists it as affected, so there is nothing to upgrade to.
  - id: PYSEC-2026-3740
    package: nltk
    scanner: pip-audit
    reason: >-
      NLTK's model-artifact APIs bypass their own path checks and can touch
      files outside the allowed roots. 3.10.3 is both the pinned and the newest
      release, and the advisory lists it as still affected, so there is no
      version to upgrade to.
    replacement_considered: >-
      nltk is pulled in by unstructured, which uses it for sentence/word
      tokenisation and POS tagging during document parsing. unstructured cannot
      be configured without it, and replacing unstructured would change how
      every existing document was parsed and chunked.
    usage_analysis: >-
      The affected APIs (TransitionParser.train/parse, AveragedPerceptron
      save/load, PerceptronTagger.save_to_json, save_maxent_params) read or
      write model files at a caller-chosen path, bypassing nltk's opt-in
      pathsec sandbox. The backend never imports nltk; unstructured only calls
      sent_tokenize, word_tokenize and pos_tag, which load models from nltk's
      fixed data directories. No code path lets user input choose
      a model import or export path, and we do not rely on pathsec.
    approved_by: "@LexLubbers"
    recheck: 2026-12-01

  - id: CVE-2026-69112
    package: accelerate
    scanner: pip-audit
    reason: >-
      Path traversal in load_checkpoint_in_model and load_checkpoint_and_dispatch,
      which read weight_map entries from sharded checkpoint indexes. No fix
      version has been published. Neither function is called anywhere in this
      repository, and the package is not installed in the image we ship:
      requirements-slim.txt drops accelerate, and both the release build
      (docker-build-soev.yaml) and the image scanned by this suite set
      USE_SLIM=true. pip-audit flags it because it reads requirements.txt as a
      source manifest, not because the artefact contains it.
    replacement_considered: >-
      No upgrade exists. Removing accelerate from requirements.txt was
      considered and rejected: that file is the CUDA/CPU image's manifest and is
      inherited from upstream, which pins the identical version. Diverging there
      would create a permanent merge conflict for a package our own builds
      already exclude.
    usage_analysis: >-
      grep for imports across backend/open_webui finds none; the single textual
      match is S3_USE_ACCELERATE_ENDPOINT, an unrelated S3 transfer setting.
      Verified absent from the running slim container.
    approved_by: Lex Lubbers, 2026-09-09
    recheck: 2026-12-09

  # ------------------------------------------------------------------- npm
  # dompurify 3.4.17 fixes the three findings below but was published 2026-10-12,
  # inside the 14-day window the required lockfile-age check enforces. NOT §7
  # exceptions: DEFERRED UPGRADES. On or after 2026-10-26 run
  # `npm update dompurify` (package.json accepts ^3.4.17) and delete all three.
  - id: GHSA-cg2g-xh64-v4q7
    package: dompurify
    scanner: npm
    reason: >-
      SAFE_FOR_TEMPLATES bypass: split template expressions survive in attached
      shadow root content on DOM output modes. Fixed in 3.4.17, published
      2026-10-12; lockfile-age refuses it until 2026-10-26.
    replacement_considered: >-
      No replacement is needed; this is a deferred upgrade. Every release before
      3.4.17 is affected, and npm has no cooldown exemption outside our own
      @gradient-ds scope.
    usage_analysis: >-
      Unreachable in what we ship. The bypass needs SAFE_FOR_TEMPLATES; no
      sanitize call under src/ sets it. The only custom config,
      DOCUMENT_PURIFY_CONFIG in src/lib/utils/htmlDocument.ts, uses
      WHOLE_DOCUMENT, RETURN_DOM, USE_PROFILES, ADD_TAGS/ADD_ATTR and
      FORBID_TAGS.
    approved_by: "@LexLubbers"
    recheck: 2026-10-26

  - id: GHSA-mrv2-3pqr-j5jr
    package: dompurify
    scanner: npm
    reason: >-
      IN_PLACE sanitizing: a hook that removes a parent or sibling leaves the
      detached subtree's event handlers armed. Fixed in 3.4.17, published
      2026-10-12; lockfile-age refuses it until 2026-10-26.
    replacement_considered: >-
      Same deferred upgrade as GHSA-cg2g-xh64-v4q7.
    usage_analysis: >-
      Unreachable in what we ship: no sanitize call under src/ sets IN_PLACE,
      and nothing registers a DOMPurify hook (no addHook call).
    approved_by: "@LexLubbers"
    recheck: 2026-10-26

  - id: GHSA-c6gr-qvv4-5v3f
    package: dompurify
    scanner: npm
    reason: >-
      The SMIL attributeName=href guard is skipped when PARSER_MEDIA_TYPE is
      application/xhtml+xml. Fixed in 3.4.17, published 2026-10-12;
      lockfile-age refuses it until 2026-10-26.
    replacement_considered: >-
      Same deferred upgrade as GHSA-cg2g-xh64-v4q7.
    usage_analysis: >-
      Unreachable in what we ship: no sanitize call under src/ sets
      PARSER_MEDIA_TYPE, so DOMPurify always parses as text/html.
    approved_by: "@LexLubbers"
    recheck: 2026-10-26

  # markdown-it 14.3.3 fixes both findings below but was published 2026-10-16,
  # inside the 14-day window the required lockfile-age check enforces. NOT §7
  # exceptions: DEFERRED UPGRADES. On or after 2026-10-30 run
  # `npm update markdown-it` (prosemirror-markdown accepts ^14.3.3) and delete
  # both entries.
  - id: GHSA-gfr2-rv44-r23c
    package: markdown-it
    scanner: npm
    reason: >-
      CVE-2026-111758. Quadratic-time rendering of a single multi-line link
      reference definition. Fixed in 14.3.3, published 2026-10-16;
      lockfile-age refuses it until 2026-10-30.
    replacement_considered: >-
      No replacement is needed; this is a deferred upgrade. Every release before
      14.3.3 is affected, and npm has no cooldown exemption outside our own
      @gradient-ds scope.
    usage_analysis: >-
      Unreachable in what we ship. markdown-it arrives only through
      prosemirror-markdown, which nothing under src/ imports, so the frontend
      bundle never contains it, and the runtime image copies only the built
      frontend (/app/build), not node_modules.
    approved_by: "@LexLubbers"
    recheck: 2026-10-30

