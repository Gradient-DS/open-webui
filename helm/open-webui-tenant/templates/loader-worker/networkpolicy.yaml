{{- if and .Values.loaderWorker.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-webui-tenant.loaderWorker.fullname" . }}-policy
  labels:
    {{- include "open-webui-tenant.loaderWorker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "open-webui-tenant.loaderWorker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the tenant open-webui pod may submit jobs / poll status.
    - from:
        - podSelector:
            matchLabels:
              {{- include "open-webui-tenant.openWebui.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.loaderWorker.config.port | default 8002 }}
    # Allow scraping from the observability namespace if/when metrics are added.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.namespace | default "observability" }}
      ports:
        - protocol: TCP
          port: {{ .Values.loaderWorker.config.port | default 8002 }}
  egress:
    # Tenant open-webui /ingest callback (same namespace, label-selected).
    - to:
        - podSelector:
            matchLabels:
              {{- include "open-webui-tenant.openWebui.selectorLabels" . | nindent 14 }}
      {{- if .Values.networkPolicy.egress.strict }}
      ports:
        - protocol: TCP
          port: 8080
      {{- end }}
    # Tenant Postgres for the loader_worker DB.
    - to:
        - podSelector:
            matchLabels:
              {{- include "open-webui-tenant.postgres.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ include "open-webui-tenant.postgres.port" . }}
    # Shared services: doc-processor + LiteLLM.
    {{- if .Values.networkPolicy.egress.strict }}
    {{- include "open-webui-tenant.egressAllow" (list . .Values.loaderWorker.networkPolicy.egressAllow) | nindent 4 }}
    {{- else }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sharedServices.namespace }}
    {{- range .Values.networkPolicy.extraEgressNamespaces }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    {{- end }}
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if not .Values.networkPolicy.egress.fqdn.enforce }}
    # External cloud APIs (OneDrive, Google Drive) — public internet only.
    {{- include "open-webui-tenant.publicEgress" . | nindent 4 }}
    {{- end }}
{{- end }}
