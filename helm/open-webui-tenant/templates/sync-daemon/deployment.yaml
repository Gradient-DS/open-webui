{{- if .Values.syncDaemon.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-webui-tenant.syncDaemon.fullname" . }}
  labels:
    {{- include "open-webui-tenant.syncDaemon.labels" . | nindent 4 }}
spec:
  # Stateless (all sync state lives in Open WebUI, D-4) — a single replica, no
  # PVC, no DB. Not autoscaled: the run is bounded by per-run concurrency, not
  # replica count.
  replicas: {{ .Values.syncDaemon.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "open-webui-tenant.syncDaemon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-webui-tenant.syncDaemon.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/sync-daemon/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "open-webui-tenant.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "open-webui-tenant.serviceAccountName" . }}
      {{- with .Values.syncDaemon.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sync-daemon
          image: "{{ .Values.syncDaemon.image.repository }}:{{ .Values.syncDaemon.image.tag }}"
          imagePullPolicy: {{ .Values.syncDaemon.image.pullPolicy | default "Always" }}
          securityContext:
            {{- toYaml .Values.syncDaemon.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.syncDaemon.service.port | default 8010 }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "open-webui-tenant.syncDaemon.fullname" . }}-config
          env:
            # Inbound bearer OWUI presents to the daemon (Sync-now / cancel).
            - name: SYNC_DAEMON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-webui-tenant.fullname" . }}-secrets
                  key: sync-daemon-api-key
            # Outbound machine key the daemon presents to OWUI (= SYNC_API_KEY).
            - name: SYNC_DAEMON_OWUI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-webui-tenant.fullname" . }}-secrets
                  key: sync-api-key
          resources:
            {{- toYaml .Values.syncDaemon.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
