  # ------------------------------------------------------------- pip-audit
  # nltk 3.10.3 is both the pinned and the newest release and the advisory
  # still lists it as affected, so there is nothing to upgrade to.
  - id: PYSEC-2026-3740
    package: nltk
    scanner: pip-audit
    reason: >-
      NLTK's model-artifact APIs bypass their own path checks and can touch
      files outside the allowed roots. 3.10.3 is both the pinned and the newest
      release, and the advisory lists it as still affected, so there is no
      version to upgrade to.
    replacement_considered: >-
      nltk is pulled in for sentence tokenisation behind langchain's text
      splitters. Replacing the splitter implementation would change how every
      existing document was chunked and would invalidate stored embeddings, so
      it is not a change a security-scanning rollout can make safely.
    usage_analysis: >-
      The affected APIs download and unpack NLTK model artifacts. This image
      downloads exactly one artifact, punkt_tab, at build time from NLTK's own
      distribution, and the runtime never calls a download or unpack API — user
      input reaches only the tokenizer, not the artifact loader.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-12-01

  # ------------------------------------------------------------------- npm
  # Both entries are the same finding seen from two angles: cypress 15 depends
  # on extract-zip, whose latest release is still affected.
  #
  # NOT a §7 exception — a DEFERRED UPGRADE. A fix exists and we intend to take
  # it; the only thing stopping us today is this repository's own 14-day
  # minimum publish age. Both entries therefore carry a short recheck
  # (2026-09-22) tied to the date the fix becomes installable (2026-09-15),
  # not the 2026-12-01 used for findings with no fix at all. If these entries
  # are still here after 2026-09-22 the upgrade was skipped, and the validator
  # will say so.
  - id: GHSA-jmr9-qjv8-65gv
    package: extract-zip
    scanner: npm
    reason: >-
      extract-zip does not validate symlinks while extracting, allowing a
      crafted archive to write outside the target directory. A FIX EXISTS:
      cypress 16.0.0 drops extract-zip entirely. It is not an unfixable
      advisory — 2.0.1 is the last extract-zip release and stays affected, but
      the dependency itself goes away on the upgrade. The upgrade is blocked
      only by age: cypress 16.0.0 was published 2026-09-01 and this
      repository's required lockfile-age check refuses anything younger than
      14 days, so it becomes installable on 2026-09-15.
    replacement_considered: >-
      No replacement is needed and none was sought; this is a deferred upgrade,
      not an exception to a permanent problem. Taking cypress 16.0.0 before
      2026-09-15 would fail lockfile-age, trading a dev-only advisory for a
      failure of the supply-chain control that protects the whole dependency
      tree. Pinning an older cypress does not help — every cypress 15.x line
      carries extract-zip. The action is to bump cypress to >=16.0.0 on or
      after 2026-09-15 and delete this entry; recheck 2026-09-22 is the
      deadline for that.
    usage_analysis: >-
      extract-zip reaches this repository only through cypress, a
      devDependency. Its single use is unpacking the Cypress binary that
      cypress.io serves over TLS during test setup. No user-supplied archive is
      ever extracted, and neither cypress nor extract-zip is installed into any
      published image — the runtime image copies only the built frontend.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-09-22

  - id: cypress
    package: cypress
    scanner: npm
    reason: >-
      npm audit reports cypress itself as high because it depends on
      extract-zip and on @cypress/request. Same finding as the entry above,
      keyed by package because the advisory ids belong to the dependencies
      rather than to cypress. A FIX EXISTS — cypress 16.0.0, published
      2026-09-01, resolves both dependency chains — and is gated only by the
      14-day minimum publish age, so it becomes installable on 2026-09-15.
      SCOPE WARNING: because this entry is keyed by package name rather than by
      advisory id, it suppresses ANY cypress-keyed HIGH npm audit reports,
      including advisories unrelated to extract-zip that appear between now and
      the upgrade. That breadth is the price of npm audit giving no advisory id
      for this finding, and it is why the recheck is two weeks out rather than
      three months.
    replacement_considered: >-
      No replacement is needed and none was sought; this is a deferred upgrade,
      not an exception to a permanent problem. cypress 16.0.0 is the fix and it
      is simply too young to install under lockfile-age until 2026-09-15. The
      action is to bump cypress to >=16.0.0 on or after that date and delete
      both this entry and the extract-zip one; recheck 2026-09-22 is the
      deadline for that.
    usage_analysis: >-
      cypress is a devDependency used by the e2e-tests workflow. It is not part
      of any published artifact and is never installed at runtime.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-09-22

  - id: GHSA-7pqw-9j4j-h8q3
    package: extract-zip
    scanner: npm
    reason: >-
      Same package and same reachability as GHSA-jmr9-qjv8-65gv: an arbitrary
      file write through a symlink in an attacker-supplied archive. Only cypress
      hands archives to extract-zip, and only its own downloaded binary.
    replacement_considered: >-
      Fixed by the same cypress 16 major, tracked separately.
    usage_analysis: >-
      Transitive beneath a devDependency; not present in the shipped bundle.
    approved_by: Lex Lubbers, 2026-09-09
    recheck: 2026-12-09

  - id: GHSA-2883-xcg3-v3hh
    package: js-yaml
    scanner: npm
    reason: >-
      CPU exhaustion when parsing YAML with many merge keys. Reached only
      beneath cypress, which parses its own configuration, not attacker input.
      The application does not parse YAML in the browser at all.
    replacement_considered: >-
      A fixed js-yaml exists, but the vulnerable version is pinned by the
      cypress tree, so reaching it means the same cypress 16 major.
    usage_analysis: >-
      Transitive beneath a devDependency. Not imported by any file under src/,
      and absent from the production bundle.
    approved_by: Lex Lubbers, 2026-09-09
    recheck: 2026-12-09

  - id: CVE-2026-69112
    package: accelerate
    scanner: pip-audit
    reason: >-
      Path traversal in load_checkpoint_in_model and load_checkpoint_and_dispatch,
      which read weight_map entries from sharded checkpoint indexes. No fix
      version has been published. Neither function is called anywhere in this
      repository, and the package is not installed in the image we ship:
      requirements-slim.txt drops accelerate, and both the release build
      (docker-build-soev.yaml) and the image scanned by this suite set
      USE_SLIM=true. pip-audit flags it because it reads requirements.txt as a
      source manifest, not because the artefact contains it.
    replacement_considered: >-
      No upgrade exists. Removing accelerate from requirements.txt was
      considered and rejected: that file is the CUDA/CPU image's manifest and is
      inherited from upstream, which pins the identical version. Diverging there
      would create a permanent merge conflict for a package our own builds
      already exclude.
    usage_analysis: >-
      grep for imports across backend/open_webui finds none; the single textual
      match is S3_USE_ACCELERATE_ENDPOINT, an unrelated S3 transfer setting.
      Verified absent from the running slim container.
    approved_by: Lex Lubbers, 2026-09-09
    recheck: 2026-12-09

