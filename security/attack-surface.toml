# Seeding order only: what must exist before an id-taking route can run.
# RUN-TAG: owui-phase6-seeding-order
#
# DO NOT key this map by parameter name. In the committed OpenAPI, `id`
# occurs 123 times and refers to unrelated resources. A chat id in a knowledge
# route would yield a 404 masquerading as exercised surface. Resolve each
# (path template, parameter) using name + the longest segment-boundary prefix.
# Prefixes match literal OpenAPI templates, not concrete request URLs.
# `key` is only a dependency label, never a global parameter-name binding.
# New routes are checked against the spec offline.
#
# Each entry has exactly one of via/body/extract (one HTTP endpoint), same_as,
# seeded_by (an allowlisted Python callable), or unseedable (written reason).
# depends_on is a list of dependency keys; {key} references use only declared
# dependencies. {token} is fresh on EVERY resolve_parameters call, in bodies,
# multipart filenames/content, and dictionary keys. Call once per pass.
# fresh=false marks immutable inputs/environment selectors, not shared fixtures.
# Product bootstrap supplies creation permissions. Resolution is serial.
#
# Handler references below are relative to backend/open_webui. These describe
# existence, not guaranteed authorization, body validity, or coverage. Machine
# credentials and external-provider sessions remain separate prerequisites.
# No unseedable entry may be silently substituted with a plausible-looking id.
# v2_refused_value is an explicit fictional probe id in drive mode only, where
# the router refuses before looking up a resource. [[control]] pins that refusal.
# backed_by="soev-solutions" seeds and field setup run only with RUNTIME_SOEV_BACKED=drive.

# Compare the complete public configuration around every pass and mutation.
# Any change fails the sweep; no local management writer remains to restore it.
preserve_configuration = true
# Config.upsert validates oauth.sub_claim for every writer (including imports)
# before any database or in-memory defaults change. Platform mode accepts only
# sub or unset; an unsafe batch refuses 403 without applying any other setting.

# Required owner controls for sweep12's previously unentered operations.
# The image-prompt operation has an exact all-actor refusal below; its supported
# title-task control uses the same seeded chat, model and authenticated owner.
required_drive_routes = [
  "GET /api/v1/chats/",
  "GET /api/v1/chats/list",
  "GET /api/v1/chats/{id}",
  "GET /api/v1/knowledge/{id}/files",
  "GET /api/v1/cloud-sync/policy",
  "POST /api/v1/cloud-sync/connections/{connection_id}/authorize",
  "POST /api/v1/knowledge/{id}/file/move",
  "POST /api/v1/knowledge/{id}/file/remove",
  "POST /api/v1/knowledge/{id}/file/update",
  "POST /api/v1/tasks/image_prompt/completions"
]

# Caller-index 404s return 403 no_access without content; individual chat 404s stay unavailable.

