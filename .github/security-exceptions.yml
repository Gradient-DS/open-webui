  - id: 58a13aec7e14637a9d50d781e3f24c7f0747c292:static/pyscript/xterm-DqawCVsv.js:generic-api-key:1
    package: frontend-vendor
    scanner: gitleaks
    reason: >-
      False positive, inherited from upstream open-webui. A minified,
