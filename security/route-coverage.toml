# Routes no security test drives, each with the reason it cannot be driven on
# the sealed CI stack. Read by backend/open_webui/test/security/test_route_coverage.py,
# which fails on an empty reason, on a waiver for a route that no longer exists,
# and on a waiver for a route the plane actually reached.
#
# "The feature is off" is never a reason here. Tenant charts only seed
# PersistentConfig (enablePersistentConfig is "true" everywhere), so any tenant
# admin can switch a feature on at runtime and a route behind a flag is
# production surface. Turn the flag on in docker-compose.ci.yaml and drive it.
# What remains is a route the sealed stack cannot reach without an external
# system it deliberately lacks, or one a working guard keeps unseedable. Each
# reason names what would close it.

# --- OAuth: the sealed stack has no identity provider ------------------------
# Production runs OAuth login (multi-tenant Entra SSO, #291), so these are real
# surface. An OIDC issuer stub on the CI network would close all seven.

[[waived]]
id = "GET /oauth/{provider}/login"
reason = "Never attempted: every owner pass skips it because `provider` is declared unseedable (attack-surface.toml, key oauth_login_provider). utils/oauth.py registers login providers only from environment configuration and the sealed stack has no OAuth issuer to register. Closes with an OIDC issuer stub."

[[waived]]
id = "GET /oauth/{provider}/callback"
