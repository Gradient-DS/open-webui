name: PR Quality Gates

on:
  pull_request:
    branches:
      - dev
      - test
      - main

# Cancel a superseded run of the same pull request; never cancel anything else.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No Docker build here: security.yml's `image / Container Scan (Trivy)` job
# builds the same Dockerfile with the same USE_SLIM=true on every PR to these
# branches, and a broken build fails that job.
jobs:
  # Job id and name kept so the check name does not change. `npm run build` is
  # not repeated here: the Dockerfile's `build` stage runs the same `npm ci
  # --force && npm run build` (Node 22, 8 GB heap) on the same tree in
  # security.yml's image job on every PR, and vitest does not need its output.
  frontend-build:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci --force

      - name: Run Frontend Unit Tests
        run: npm run test:frontend

  backend-format:
    name: Backend Format (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Paths belong in `src`, not `args` — `src` defaults to the whole
      # workspace, so the paths below were never restricting the scope and ruff
      # was checking the entire repo. That went unnoticed until ruff enabled
      # markdown formatting by default, at which point it started reformatting
      # `.claude/commands/*.md` and `collab/docs/*.md` and failed every PR.
      # There are no markdown files under backend/ or scripts/.
      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check
          src: backend scripts

      # Logic-error sweep (undefined names etc.) — ported from upstream's
      # backend.yaml before it was disabled; caught a real F821 in this repo.
      - name: Ruff logic-error check
        uses: astral-sh/ruff-action@v3
        with:
          args: check --select=F --ignore=F401,F403,F405,F541,F811,F841 backend/ scripts/

  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r backend/requirements.txt

      - name: Run pytest (working tests only)
        env:
          WEBUI_SECRET_KEY: test-secret-key
        run: |
          source .venv/bin/activate
          cd backend
          PYTHONPATH=. pytest \
            open_webui/test/util/test_features.py \
            open_webui/test/util/test_chat_message_analytics.py \
            -v --tb=short

  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Lint Helm chart
        run: helm lint helm/open-webui-tenant

      - name: Template Helm chart (catch rendering errors)
        run: helm template test-release helm/open-webui-tenant > /dev/null

      - name: Template Helm chart with external Postgres values
        # All six DB consumers must point at postgres.host, none at the bundled Service.
        run: |
          helm template test-release helm/open-webui-tenant -f helm/open-webui-tenant/ci/external-postgres-values.yaml > /tmp/external-postgres.yaml
          test "$(grep -c 'pg-external.database-staging' /tmp/external-postgres.yaml)" -eq 6
          ! grep -q 'open-webui-tenant-postgres' /tmp/external-postgres.yaml
