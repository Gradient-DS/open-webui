# Derivation gaps measured from committed security/openapi.json using openapi-surface.
# Phase 4b audited all 27 previously labelled untyped JSON write bodies.
# 25 blind body operations remain: 17 JSON writes, 1 JSON read, 7 multipart.
# The 17 writes are 10 already typed boolean/integer-only bodies, 5 author-defined
# valve bodies, 1 arbitrary config-import blob, and 1 typed provider map whose
# dynamic keys the derivation deliberately does not traverse.
# Exact set equality in test_writable_fields.py rejects missing or stale waivers.
# Known fields in open objects are not exhaustive coverage of extension data.

[[waived]]
id = "POST /api/v1/archives/admin/config"
reason = "ArchiveConfigForm already declares archival booleans and retention-day integers. There are no named string leaves for the string-only corpus; further body typing would not help. Revisit if string fields are added or the corpus supports boolean/integer values."

