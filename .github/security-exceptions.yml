# Security scanning exceptions for open-webui (Gradient-DS fork).
#
# Policy (spec §7): fixable -> upgrade, no exception. No fix -> replace the
# package. Only where neither is possible may an exception exist, and it needs
# a second reviewer from @Gradient-DS/security who has confirmed the vulnerable
# path is unreachable in our usage.
#
# Every entry below is either a gitleaks FALSE POSITIVE (a placeholder, a key
# name, a doc example, or a local-dev credential) or a real advisory whose
# upstream has published no fixed release we are able to install today. The
# advisories the previous workflow suppressed inline are NOT carried over —
# they were re-triaged individually and all but the ones listed here were
# closed by an upgrade, a removal, or by no longer being reported.
#
# CONVENTION — do not quote the offending text in a justification. Reproducing
# a secret-shaped string here makes THIS file match the same rule, at a new
# fingerprint. That cannot be fixed by adding another exception: a fingerprint
# contains the commit SHA, so excepting it edits the file, changes the commit,
# and changes the fingerprint. Describe the finding instead of showing it.
version: 1
exceptions:
  # ---------------------------------------------------------------- gitleaks
  # All eight fingerprints sit in commits that are already ancestors of `dev`.
  # A fingerprint contains the commit SHA, so editing today's files cannot
  # clear any of them; only history rewriting could, which none of these
  # warrant.
  - id: d1e19e901820bbc7d90f36dfd9911bb87e06aa92:thoughts/shared/plans/2026-04-25-shared-services-loader-worker.md:curl-auth-header:1720
    package: docs
    scanner: gitleaks
    reason: >-
      False positive. A planning document's manual-test recipe shows a curl
      call carrying an obviously-fabricated bearer value and a fabricated user
      identifier. Neither authenticates anything.
      (Deliberately not quoted here — see the header note.)
    replacement_considered: >-
      No dependency is involved. The file lives under thoughts/, which is now
      git-ignored and absent from every live branch; the finding exists only in
      an immutable commit.
    usage_analysis: >-
      The value is a literal placeholder in prose describing how to exercise a
      local dev stack. It was never issued by any identity provider and grants
      no access to any environment.
    approved_by: "@LexLubbers"
    recheck: 2026-12-01

  - id: 7029d372c3de8c09e7a2c9ed232c6179586ebbb1:src/lib/components/admin/Settings/Integrations.svelte:curl-auth-header:271
    package: frontend
    scanner: gitleaks
    reason: >-
      False positive. The admin Integrations settings panel renders a
      copy-paste curl example for the ingest API. gitleaks matched the
      authorization header in that example, whose value is a visible
      all-caps placeholder the operator is expected to replace.
    replacement_considered: >-
      No dependency is involved. Removing the example would degrade admin
      documentation to satisfy a scanner heuristic; the current tip of the file
      still renders the same example by design.
    usage_analysis: >-
      The string is displayed to a signed-in admin as documentation. It is not
      sent anywhere, is not a credential, and authenticates nothing.
    approved_by: "@LexLubbers"
    recheck: 2026-12-01

  - id: e0272831a4a5cc7a9fc0ffe361c8597f11fa487b:searxng/settings.yml:generic-api-key:28
    package: searxng
    scanner: gitleaks
    reason: >-
      False positive. A local-only SearXNG dev configuration carried a
      deliberately non-secret session key whose own value spells out, in
      leetspeak, that it is for development and must be changed in production.
      The file no longer exists on any live branch.
    replacement_considered: >-
      No dependency is involved. The file was deleted from the repository; the
      finding survives only in an immutable commit.
    usage_analysis: >-
      The value signed SearXNG session cookies for a developer's local docker
      compose stack. It was never used by any deployed environment — every
      cluster's SearXNG key comes from 1Password via External Secrets — so
      nothing it protected was ever reachable off a laptop.
    approved_by: "@LexLubbers"
    recheck: 2026-12-01

  - id: 2f4f4c23764b03230cd626e3ba47b4ba93067450:backend/open_webui/test/apps/webui/storage/test_provider.py:generic-api-key:294
    package: backend-tests
    scanner: gitleaks
    reason: >-
      False positive, inherited from upstream open-webui. A storage-provider
      unit test builds an Azure connection string for Azurite, the Microsoft
      storage emulator, whose account key is a fixed value published in
      Microsoft's own documentation for exactly this purpose.
    replacement_considered: >-
      No dependency is involved. The value is mandated by the emulator; any
      other value makes the test fail. The commit is upstream history and is
      not ours to rewrite.
    usage_analysis: >-
      The endpoint is a loopback address and the credential is the emulator's
      universally known development account. It grants access to nothing beyond
      a container running on the test host.
    approved_by: "@LexLubbers"
    recheck: 2026-12-01

  - id: 8b3e370a6eec353c931af76739bae2506238d726:backend/apps/rag/search/testdata/serpstack.json:generic-api-key:26
    package: backend-tests
    scanner: gitleaks
    reason: >-
      False positive, inherited from upstream open-webui. A recorded search-API
