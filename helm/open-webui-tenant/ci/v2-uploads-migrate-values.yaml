# The v2 tenant of v2-values.yaml running an uploads-only migrate.
tenant:
  name: v2
  domain: v2.soev.ai
soevApi:
  url: http://soev-api:8000
  audience: soev-api
  servicePrincipal: open-webui
  migrate:
    enabled: true
    # Uploads-only run after an earlier apply: no v2 config or model map needed.
    id: v2-uploads-1
    mode: uploads
    image:
      tag: v2-migrate-test
agentApi:
  runtime: v2
liveDocuments:
  enabled: true
liveMail:
  enabled: true
webuiUrl: https://v2.soev.ai
openWebui:
  replicaCount: 2
  persistence:
    enabled: false
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  config:
    vectorDb: pgvector
    databaseUser: soev_v2
    databaseName: soev_v2
    ragEmbeddingModel: bge-m3
    agentApiEnabled: "true"
pgvector:
  maxVectorLength: 1024
  createExtension: false
postgres:
  enabled: false
  host: pg-v2-rw.database-v2.svc.cluster.local
  port: 5433
  user: soev_v2
  database: soev_v2
weaviate:
  enabled: false
redis:
  enabled: true
externalSecrets:
  enabled: true
  onepassword:
    itemName: soev-v2
secretStoreRef:
  kind: ClusterSecretStore
  name: soev-staging
networkPolicy:
  scope: release
  extraEgressNamespaces:
    - database-v2
ciliumNetworkPolicy:
  enabled: true
extraEnv:
  - name: SOEV_API_JOB_POLL_SECONDS
    value: "3"
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
