{{- if .Values.ciliumNetworkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-ingress
  labels:
    {{- include "open-webui-tenant.labels" . | nindent 4 }}
spec:
  {{- if not (has .Values.networkPolicy.scope (list "namespace" "release")) }}
  {{- fail "networkPolicy.scope must be namespace or release" }}
  {{- end }}
  {{- if eq .Values.networkPolicy.scope "release" }}
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  {{- else }}
  endpointSelector: {}
  {{- end }}
  ingress:
    - fromEntities:
        - ingress
{{- end }}
