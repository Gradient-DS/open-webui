    approved_by: "@LexLubbers"
    recheck: 2026-12-01

  - id: 58a13aec7e14637a9d50d781e3f24c7f0747c292:static/pyscript/xterm-DqawCVsv.js.map:generic-api-key:1
    package: frontend-vendor
