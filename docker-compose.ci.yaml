# Standalone Phase 1 stack. Never merge with a development Compose file or env_file.
# Build-time downloads are allowed; the running application has only `internal`.
# Recreate the stack for a fresh run: service databases are intentionally ephemeral.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "openwebui"
      POSTGRES_USER: "openwebui"
      POSTGRES_PASSWORD: "ci-only-password"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openwebui", "-d", "openwebui"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  weaviate:
    image: semitechnologies/weaviate:1.35.0
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none" # App supplies stub embeddings; no model downloads.
      ENABLE_MODULES: ""
      DISABLE_TELEMETRY: "true" # Weaviate must not generate ordinary public traffic either.
      CLUSTER_HOSTNAME: "node1"
      QUERY_DEFAULTS_LIMIT: "25"
    tmpfs:
      - /var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [internal]

  redis:
    image: redis:7-alpine
    # Real Redis is mandatory: invalidate_token silently does nothing without it.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  stub:
    image: python:3.11-slim
    command: ["python", "-B", "/stub.py"]
    volumes:
      - ./cicd/stub_upstream.py:/stub.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    networks: [internal]

  open-webui:
    container_name: open-webui-ci
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Stop GitHub update checks and Hugging Face downloads on normal requests.
      OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
      # Config persisted by an earlier request must not override CI destinations.
      ENABLE_PERSISTENT_CONFIG: "false"
      # Explicit parts agree with DATABASE_URL; env.py can rebuild the URL from them.
      DATABASE_URL: "postgresql://openwebui:ci-only-password@postgres:5432/openwebui"
      DATABASE_TYPE: "postgresql"
      DATABASE_HOST: "postgres"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "openwebui"
      DATABASE_USER: "openwebui"
      DATABASE_PASSWORD: "ci-only-password"
      # A real vector database and Redis keep retrieval and token revocation live.
      VECTOR_DB: "weaviate"
      WEAVIATE_HTTP_HOST: "weaviate"
      WEAVIATE_GRPC_HOST: "weaviate"
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_PORT: "50051"
      WEAVIATE_HTTP_SECURE: "false"
      WEAVIATE_GRPC_SECURE: "false"
      REDIS_URL: "redis://redis:6379/0"
      # The scalar default is real api.openai.com, even without a key.
      OPENAI_API_BASE_URL: "http://stub:8000/v1"
      OPENAI_API_BASE_URLS: "http://stub:8000/v1"
      OPENAI_API_KEY: "ci-stub-key"
      OPENAI_API_KEYS: "ci-stub-key"
      # An explicit URL bypasses the import-time Ollama port probes.
      OLLAMA_BASE_URL: "http://stub:8000"
      OLLAMA_BASE_URLS: "http://stub:8000"
      # These handler-reachable fork services must all stay in-network.
      AGENT_API_BASE_URL: "http://stub:8000"
      AGENT_API_KEY: "ci-stub-key"
      SEARCH_API_BASE_URL: "http://stub:8000"
      SEARCH_API_KEY: "ci-stub-key"
      SYNC_DAEMON_URL: "http://stub:8000"
      PIPELINE_API_BASE_URL: "http://stub:8000"
      PIPELINE_API_KEY: "ci-stub-key"
      # config.py resets scalar OPENAI_API_BASE_URL after forming the URL list;
      # embedding/audio/image defaults would therefore still point at OpenAI.
      RAG_EMBEDDING_ENGINE: "openai"
      RAG_EMBEDDING_MODEL: "text-embedding-3-small" # Stub returns 1536 dimensions.
      RAG_OPENAI_API_BASE_URL: "http://stub:8000/v1"
      RAG_OPENAI_API_KEY: "ci-stub-key"
      AUDIO_STT_OPENAI_API_BASE_URL: "http://stub:8000/v1"
      AUDIO_STT_OPENAI_API_KEY: "ci-stub-key"
      AUDIO_TTS_OPENAI_API_BASE_URL: "http://stub:8000/v1"
      AUDIO_TTS_OPENAI_API_KEY: "ci-stub-key"
      IMAGES_OPENAI_API_BASE_URL: "http://stub:8000/v1"
      IMAGES_OPENAI_API_KEY: "ci-stub-key"
      # Exercise configured webhooks locally.
      WEBHOOK_URL: "http://stub:8000/webhook"
      FEEDBACK_REPORT_SLACK_WEBHOOK_URL: "http://stub:8000/slack"
      FEEDBACK_REPORT_WEBHOOK_URL: "http://stub:8000/feedback"
      # Empty means unconfigured, explicitly preventing host-env inheritance.
      ENABLE_OTEL: "" # Otherwise OTLP exporters default to localhost:4317.
      DATALAB_MARKER_API_KEY: "" # Blank Marker URL alone falls back to public datalab.to.
      WEB_SEARCH_ENGINE: "" # Empty engine raises before any provider dispatch.
      RAG_CONTENT_EXTRACTION_ENGINE: "" # Plan spelling; retain as an explicit guard.
      CONTENT_EXTRACTION_ENGINE: "" # Actual env name: select the native local loader.
      WEB_LOADER_ENGINE: "" # No external loader or startup Playwright installation.
      CUSTOM_NAME: "" # Legacy custom branding downloads from api.openwebui.com.
      LICENSE_KEY: "" # License lookup contacts public Open WebUI servers.
      RAG_RERANKING_ENGINE: "" # Do not invoke an external reranker.
      RAG_RERANKING_MODEL: "" # Do not load/download a local reranker either.
      COMFYUI_BASE_URL: "" # No ComfyUI image backend selected.
      CODE_EXECUTION_JUPYTER_URL: "" # No external Jupyter kernel configured.
      CODE_INTERPRETER_JUPYTER_URL: "" # Same for the chat code interpreter.
      # OAuth can fetch before login; every provider must remain unconfigured.
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      MICROSOFT_CLIENT_ID: ""
      MICROSOFT_CLIENT_SECRET: ""
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      OAUTH_CLIENT_ID: ""
      OAUTH_CLIENT_SECRET: ""
      OPENID_PROVIDER_URL: ""
      FEISHU_CLIENT_ID: ""
      FEISHU_CLIENT_SECRET: ""
      # Cloud sync needs credentials and stored tokens; fresh CI has neither.
      ENABLE_GOOGLE_DRIVE_INTEGRATION: "false"
      GOOGLE_DRIVE_CLIENT_ID: ""
      ENABLE_ONEDRIVE_INTEGRATION: "false"
      ONEDRIVE_CLIENT_ID: ""
      ONEDRIVE_CLIENT_ID_PERSONAL: ""
      ONEDRIVE_CLIENT_ID_BUSINESS: ""
      ENABLE_CONFLUENCE_INTEGRATION: "false"
      CONFLUENCE_OAUTH_CLIENT_ID: ""
      CONFLUENCE_OAUTH_CLIENT_SECRET: ""
      CONFLUENCE_BASIC_AUTH_USERNAME: ""
      CONFLUENCE_BASIC_AUTH_API_TOKEN: ""
      CONFLUENCE_SCOPED_API_TOKEN: ""
      # Missing Graph mail credentials raise before token acquisition or sendMail.
      EMAIL_GRAPH_TENANT_ID: ""
      EMAIL_GRAPH_CLIENT_ID: ""
      EMAIL_GRAPH_CLIENT_SECRET: ""
      # Stable disposable-stack signing key, not a production credential.
      WEBUI_SECRET_KEY: "ci-only-secret-do-not-use-outside-this-stack"
    volumes:
      # Root-level artefacts are outside the Dockerfile's backend COPY.
      - ./docker-compose.ci.yaml:/app/docker-compose.ci.yaml:ro
      - ./cicd:/app/cicd:ro
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      redis:
        condition: service_healthy
      stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s
    networks: [internal]

  entry:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./cicd/nginx-ci.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      open-webui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal, edge]

networks:
  internal:
    internal: true # No external gateway for the guarded app or its dependencies.
  edge: {} # Only the fixed-destination entry proxy may join this network.
