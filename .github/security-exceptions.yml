      third-party service.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-12-01

  - id: 501ff7a98bb874007ea1645d9fa371f75ae81f1a:backend/apps/rag/search/testdata/serpstack.json:generic-api-key:26
    package: backend-tests
    scanner: gitleaks
    reason: >-
      False positive. The same upstream test fixture as the entry above, at the
