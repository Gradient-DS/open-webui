# Seeding order only: what must exist before an id-taking route can run.
# RUN-TAG: owui-phase6-seeding-order
#
# DO NOT key this map by parameter name. In the committed OpenAPI, `id`
# occurs 123 times and refers to unrelated resources. A chat id in a knowledge
# route would yield a 404 masquerading as exercised surface. Resolve each
# (path template, parameter) using name + the longest segment-boundary prefix.
# Prefixes match literal OpenAPI templates, not concrete request URLs.
# `key` is only a dependency label, never a global parameter-name binding.
# More-specific overrides matter: files/{id}/attachments has a different
# parent seed from files/{id}. New routes are checked against the spec offline.
#
# Each entry has exactly one of via/body/extract (one HTTP endpoint), same_as,
# seeded_by (an allowlisted Python callable), or unseedable (written reason).
# depends_on is a list of dependency keys; {key} references use only declared
# dependencies. {token} is fresh on EVERY resolve_parameters call, in bodies,
# multipart filenames/content, and dictionary keys. Call once per pass.
# fresh=false marks immutable inputs/environment selectors, not shared fixtures.
# actor=admin avoids feature permissions during setup; dependent owner checks use the same actor.
# The integration attachment remains owned by the supplied client.
# Configuration setup enables the creation gates it names, and integration/
# terminal setup merges existing configuration. Resolution is serial.
#
# Handler references below are relative to backend/open_webui. These describe
# existence, not guaranteed authorization, body validity, or coverage. Machine
# credentials and external-provider sessions remain separate prerequisites.
# No unseedable entry may be silently substituted with a plausible-looking id.

# Full export snapshots protect every pass and every mutating request, without
# selecting keys or excluding routes. Startup recovers interrupted snapshots and
# corpus values from older runs before resolving any fixtures.
preserve_configuration = true

# Configuration a tenant admin can switch on at runtime but the stack cannot set
# from its environment. Applied after configuration recovery and before any
# pass snapshots, so every restore keeps it. Chart values only seed
# PersistentConfig, so each key here is production surface; route-coverage.toml
# states the rule. CI-005 in plane-findings.md.
[stack_configuration]
# Five tenants run self-signup. The first signup turns signup off in-process
# (routers/auths.py:signup), and identity bootstrap is that signup, so an
# ENABLE_SIGNUP environment variable cannot keep it on.
"ui.enable_signup" = true
# PersistentConfig a tenant admin flips in the admin UI (mkbot runs it); discovery/* answered 503 without it.
"rag.enable_filter_ui" = true
# PersistentConfig; the model-path pass drives tasks/auto/completions as a control.
"task.autocomplete.enable" = true

[[parameter]]
key = "namespace"
name = "namespace"
prefix = "/api/v1/configs/namespace/{namespace}"
description = "routers/configs.py:import_config/get_config_namespace. Enable creation gates through HTTP before dependent seeds; create a unique namespace marker."
seeded_by = "prepare_configuration"
depends_on = []
actor = "admin"
config = { "folders.enable" = true, "memories.enable" = true, "channels.enable" = true, "calendar.enable" = true, "automations.enable" = true, "admin.enable_user_archival" = true }

