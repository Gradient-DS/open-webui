name: Security Scanning

on:
  push:
    branches: [main, dev, test]
  # `test` included so a hotfix PR is scanned before it lands rather than at
  # the release gate. Without it, PRs into `test` skipped these jobs entirely
  # and the first scan happened on the test → main release PR — where a
  # pre-existing dependency advisory shows up looking like a release blocker.
  pull_request:
    branches: [main, dev, test]
  # Daily: catches advisories published against code and images that have not
  # changed, which a push whose scans are reused (see `reuse`) does not.
  schedule:
    - cron: '0 6 * * *'

# Only a superseded pull-request run is cancelled: its commit is no longer the
# one that would merge. Push and scheduled runs each get a group of their own
# (keyed on run_id), because every push to dev/test/main is a distinct tree
# that must be scanned -- grouping them by ref cancelled 12 of 27 dev-push
# scans, and even with cancel-in-progress off a shared group still drops the
# older of two queued runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # On push: did a pull-request run of this workflow already pass on exactly
  # this git tree? Only then are `source` and `lockfile-age` skipped. Any
  # difference, including another PR landing in between, runs everything.
  # Public repo: a fork PR's run executes the fork's copy of this file and
  # could upload a record for any tree. security-ci v7's `check` trusts only
  # a record uploaded by a pull_request run from a branch of this repository.
  reuse:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      hit: ${{ steps.check.outputs.hit }}
    steps:
      - id: check
        uses: Gradient-DS/security-ci/actions/tested-tree/check@05a6276fff8a3a2a95abb95cc441041eb951df4f # v7
        with:
          workflow-key: security

  source:
    needs: reuse
    # Every PR and scheduled run; a push unless its exact tree already passed.
    if: ${{ !cancelled() && needs.reuse.result != 'failure' && needs.reuse.outputs.hit != 'true' }}
    uses: Gradient-DS/security-ci/.github/workflows/security-source.yml@05a6276fff8a3a2a95abb95cc441041eb951df4f # v7
    secrets: inherit
    permissions:
      contents: read
      issues: write
    with:
      python-paths: 'backend/'
      # Both files are audited: the image built below installs
      # requirements-slim.txt (USE_SLIM=true) while the CUDA/CPU images install
      # requirements.txt, so auditing only one leaves the other unscanned.
      python-requirements: 'backend/requirements.txt backend/requirements-slim.txt'
      node-dirs: '.'

  # Pull requests only. A push to main/dev/test is scanned by
  # docker-build-soev.yaml's `scan-image`, on the digest it published; the
  # daily run scans the published digests (`image-published`).
  image:
    if: github.event_name == 'pull_request'
    uses: Gradient-DS/security-ci/.github/workflows/security-image.yml@05a6276fff8a3a2a95abb95cc441041eb951df4f # v7
    secrets: inherit
    permissions:
      contents: read
      packages: read
    with:
      context: .
      dockerfile: Dockerfile
      image-name: open-webui
      # The build args docker-build-soev.yaml ships with, so the scanned image
      # is the production one (UID/GID 1000) and its layers match dev's
      # registry cache. A gha cache write would only evict other entries: the
      # repo is over its GHA cache limit, and the registry cache is fresher.
      # [Gradient] APT_UPGRADE_EPOCH is per run, as in docker-build-soev.yaml, so
      # the scan sees today's Debian fixes even where dev's cache holds older ones.
      build-args: |
        BUILD_HASH=${{ github.sha }}
        USE_SLIM=true
        UID=1000
        GID=1000
        APT_UPGRADE_EPOCH=${{ github.run_id }}-${{ github.run_attempt }}
      # Public package: readable without auth, so fork PRs can read it too.
      cache-from: type=registry,ref=ghcr.io/gradient-ds/open-webui:cache-slim-linux-amd64-dev
      cache-write: false

  # Scheduled: the linux/amd64 digest each branch tag currently points at.
  resolve-published:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dev: ${{ steps.resolve.outputs.dev }}
      test: ${{ steps.resolve.outputs.test }}
      main: ${{ steps.resolve.outputs.main }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          for branch in dev test main; do
            digest=$(docker buildx imagetools inspect --raw "ghcr.io/gradient-ds/open-webui:$branch" | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no linux/amd64 manifest for :$branch"; exit 1; }
            echo "$branch=ghcr.io/gradient-ds/open-webui@$digest" >> "$GITHUB_OUTPUT"
            echo "$branch -> $digest"
          done

  image-published:
    needs: resolve-published
    strategy:
      fail-fast: false
      matrix:
        branch: [dev, test, main]
    uses: Gradient-DS/security-ci/.github/workflows/security-image.yml@05a6276fff8a3a2a95abb95cc441041eb951df4f # v7
    secrets: inherit
    permissions:
      contents: read
      packages: read
      issues: write
    with:
      image-name: open-webui-${{ matrix.branch }}
      image-ref: ${{ needs.resolve-published.outputs[matrix.branch] }}
      notify-on-schedule-failure: true

  # Job id (and thus the status-check name shown to branch protection) must
  # stay exactly "lockfile-age" — it is configured as a required check on
  # dev and main so a too-young package-lock.json cannot merge.
  lockfile-age:
    needs: reuse
    # Same reuse rule as `source`: a package only gets older, so a tree that
    # passed keeps passing.
    if: ${{ !cancelled() && needs.reuse.result != 'failure' && needs.reuse.outputs.hit != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check package-lock.json publish ages
        run: node scripts/check-lockfile-age.mjs

  # Named so a required check cannot be satisfied by runtime-security.yml's
  # `runtime-gate` or any other workflow's generic `gate`.
  gate:
    name: security-gate
    needs: [reuse, source, image, image-published]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every security job that applies succeeded
        env:
          EVENT: ${{ github.event_name }}
          REUSE: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.hit }}
          SOURCE: ${{ needs.source.result }}
          IMAGE: ${{ needs.image.result }}
          PUBLISHED: ${{ needs.image-published.result }}
        run: |
          echo "event=$EVENT  reuse=$REUSE  reused=$REUSED  source=$SOURCE  image=$IMAGE  published=$PUBLISHED"
          # A failed tree lookup is red, never a silent pass or skip.
          if [ "$EVENT" = "push" ] && [ "$REUSE" != "success" ]; then echo "tested-tree lookup did not succeed"; exit 1; fi
          # A skipped source scan passes only on an exact-tree reuse.
          [ "$SOURCE" = "success" ] || { [ "$EVENT" = "push" ] && [ "$REUSE" = "success" ] && [ "$REUSED" = "true" ] && [ "$SOURCE" = "skipped" ]; } || exit 1
          case "$EVENT" in
            pull_request) [ "$IMAGE" = "success" ] ;;
            schedule) [ "$PUBLISHED" = "success" ] ;;
            # The pushed digest is scanned by docker-build-soev.yaml.
            push) true ;;
            *) echo "unexpected event $EVENT"; exit 1 ;;
          esac

  # Last: marks this PR's merge tree as passed, for `reuse` on the push that
  # lands it. Only when every scan really ran and passed, and never for a fork.
  record:
    needs: [source, image, lockfile-age, gate]
    # !cancelled(): without it the implicit success() also demands the
    # skipped `reuse` job upstream, and record would never run on a PR.
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.source.result == 'success'
      && needs.image.result == 'success'
      && needs.lockfile-age.result == 'success'
      && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Gradient-DS/security-ci/actions/tested-tree/record@05a6276fff8a3a2a95abb95cc441041eb951df4f # v7
        with:
          workflow-key: security
