name: Security Scanning

on:
  push:
    branches: [main, dev, test]
  # `test` included so a hotfix PR is scanned before it lands rather than at
  # the release gate. Without it, PRs into `test` skipped these jobs entirely
  # and the first scan happened on the test → main release PR — where a
  # pre-existing dependency advisory shows up looking like a release blocker.
  pull_request:
    branches: [main, dev, test]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC

# Only a superseded pull-request run is cancelled: its commit is no longer the
# one that would merge. Push and scheduled runs each get a group of their own
# (keyed on run_id), because every push to dev/test/main is a distinct tree
# that must be scanned -- grouping them by ref cancelled 12 of 27 dev-push
# scans, and even with cancel-in-progress off a shared group still drops the
# older of two queued runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    uses: Gradient-DS/security-ci/.github/workflows/security-source.yml@323449ab6e138872d5993a86d849cd3697075289 # v6
    secrets: inherit
    permissions:
      contents: read
      issues: write
    with:
      python-paths: 'backend/'
      # Both files are audited: the image built below installs
      # requirements-slim.txt (USE_SLIM=true) while the CUDA/CPU images install
      # requirements.txt, so auditing only one leaves the other unscanned.
      python-requirements: 'backend/requirements.txt backend/requirements-slim.txt'
      node-dirs: '.'

  # Not on push: a push to main/dev/test is scanned by docker-build-soev.yaml's
  # `scan-image`, on the digest it published.
  image:
    if: github.event_name != 'push'
    uses: Gradient-DS/security-ci/.github/workflows/security-image.yml@323449ab6e138872d5993a86d849cd3697075289 # v6
    secrets: inherit
    permissions:
      contents: read
      packages: read
    with:
      context: .
      dockerfile: Dockerfile
      image-name: open-webui
      # The build args docker-build-soev.yaml ships with, so the scanned image
      # is the production one (UID/GID 1000) and its layers match dev's
      # registry cache. A gha cache write would only evict other entries: the
      # repo is over its GHA cache limit, and the registry cache is fresher.
      build-args: |
        BUILD_HASH=${{ github.sha }}
        USE_SLIM=true
        UID=1000
        GID=1000
      # Public package: readable without auth, so fork PRs can read it too.
      cache-from: type=registry,ref=ghcr.io/gradient-ds/open-webui:cache-slim-linux-amd64-dev
      cache-write: false

  # Job id (and thus the status-check name shown to branch protection) must
  # stay exactly "lockfile-age" — it is configured as a required check on
  # dev and main so a too-young package-lock.json cannot merge.
  lockfile-age:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check package-lock.json publish ages
        run: node scripts/check-lockfile-age.mjs

  gate:
    needs: [source, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every security job succeeded
        env:
          SOURCE: ${{ needs.source.result }}
          IMAGE: ${{ needs.image.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "event=$EVENT  source=$SOURCE  image=$IMAGE"
          [ "$SOURCE" = "success" ] || exit 1
          # On push the image is scanned by docker-build-soev.yaml instead.
          [ "$IMAGE" = "success" ] || { [ "$EVENT" = "push" ] && [ "$IMAGE" = "skipped" ]; }
