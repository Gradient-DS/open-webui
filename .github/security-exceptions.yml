  # ------------------------------------------------------------- pip-audit
  # chromadb 1.5.9 is the latest release; none of the four advisories below has
  # a fixed version. Replacing chromadb is not viable: it is upstream
  # open-webui's default vector store and one of eight interchangeable backends
  # behind VECTOR_DB, so removing it from the dependency set would break every
  # deployment that has not opted into another backend and would conflict with
  # every upstream merge.
  - id: PYSEC-2026-311
    package: chromadb
    scanner: pip-audit
    reason: >-
      Pre-authentication code injection in ChromaDB's server. Reported against
      1.5.9, which is the newest release; upstream has published no fixed
      version, so there is nothing to upgrade to.
    replacement_considered: >-
      chromadb is upstream's default VECTOR_DB backend and is imported only on
      that code path. Dropping it would force every unconfigured deployment onto
      a different store and would diverge this fork from upstream in the module
      most likely to change. Switching the default was rejected as out of scope
      for a scanning rollout.
    usage_analysis: >-
      The vulnerable surface is ChromaDB's own HTTP server. Gradient tenants run
      VECTOR_DB=weaviate, so the module is never imported there. Where the
      default is left in place, open-webui instantiates an embedded
      PersistentClient against a local path and never starts the server, so the
      pre-auth request handler this advisory concerns is not reachable. A
      deployment pointed at a shared Chroma server via CHROMA_HTTP_HOST would be
      exposed, and that configuration is not used by us.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-12-01

  - id: CVE-2026-45830
    package: chromadb
    scanner: pip-audit
    reason: >-
      Any authenticated ChromaDB user can read, write or delete data in another
      tenant's collection. Reported against 1.5.9, the newest release; no fixed
      version exists.
    replacement_considered: >-
      As for PYSEC-2026-311 above — chromadb is upstream's default backend and
      cannot be removed without breaking unconfigured deployments.
    usage_analysis: >-
      The flaw is in ChromaDB's server-side tenant scoping. open-webui's
      embedded PersistentClient runs single-tenant against a local path with no
      authentication layer at all, so there are no other tenants to cross into.
      Gradient tenants use Weaviate, where each tenant already has its own
      isolated instance.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-12-01

  - id: CVE-2026-45831
    package: chromadb
    scanner: pip-audit
    reason: >-
      ChromaDB's SimpleRBACAuthorizationProvider grants a permission without
      checking which tenant, database or collection it applies to. Reported
      against 1.5.9, the newest release; no fixed version exists.
    replacement_considered: >-
      As for PYSEC-2026-311 above.
    usage_analysis: >-
      SimpleRBACAuthorizationProvider is a server-side component configured on a
      ChromaDB server. open-webui never runs one: the client-side
      chroma_client_auth_provider setting selects how the client presents
      credentials, not how a server authorises them. Nothing in this repository
      instantiates the vulnerable provider.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-12-01

  - id: CVE-2026-45833
    package: chromadb
    scanner: pip-audit
    reason: >-
      Code injection in ChromaDB, rated critical. Reported against 1.5.9, the
      newest release; upstream has published no fixed version.
    replacement_considered: >-
      As for PYSEC-2026-311 above.
    usage_analysis: >-
      Reachable through ChromaDB's server API, which open-webui does not run.
      The embedded client path used here passes only collection names, ids,
      documents and metadata that originate from the application itself.
      Deployments that point at an external Chroma server would be exposed;
      none of ours do.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-12-01

  - id: PYSEC-2026-3740
    package: nltk
    scanner: pip-audit
    reason: >-
      NLTK's model-artifact APIs bypass their own path checks and can touch
      files outside the allowed roots. 3.10.3 is both the pinned and the newest
      release, and the advisory lists it as still affected, so there is no
      version to upgrade to.
    replacement_considered: >-
      nltk is pulled in for sentence tokenisation behind langchain's text
      splitters. Replacing the splitter implementation would change how every
      existing document was chunked and would invalidate stored embeddings, so
      it is not a change a security-scanning rollout can make safely.
    usage_analysis: >-
      The affected APIs download and unpack NLTK model artifacts. This image
      downloads exactly one artifact, punkt_tab, at build time from NLTK's own
      distribution, and the runtime never calls a download or unpack API — user
      input reaches only the tokenizer, not the artifact loader.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-12-01

  # ------------------------------------------------------------------- npm
  # Both entries are the same finding seen from two angles: cypress 15 depends
  # on extract-zip, whose latest release is still affected.
  - id: GHSA-jmr9-qjv8-65gv
    package: extract-zip
    scanner: npm
    reason: >-
      extract-zip does not validate symlinks while extracting, allowing a
      crafted archive to write outside the target directory. 2.0.1 is the
      newest release and is still affected; the only fix is to stop depending
      on it, which cypress did in 16.0.0.
    replacement_considered: >-
      cypress 16.0.0 drops extract-zip and resolves this, but it was published
      on 2026-09-01 and this repository's required lockfile-age check refuses
      any package younger than 14 days. Upgrading now would trade a dev-only
      advisory for a failure of a supply-chain control that protects the whole
      dependency tree. The upgrade becomes installable in mid-September and
      should be taken then.
    usage_analysis: >-
      extract-zip reaches this repository only through cypress, a
      devDependency. Its single use is unpacking the Cypress binary that
      cypress.io serves over TLS during test setup. No user-supplied archive is
      ever extracted, and neither cypress nor extract-zip is installed into any
      published image — the runtime image copies only the built frontend.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-12-01

  - id: cypress
    package: cypress
    scanner: npm
    reason: >-
      npm audit reports cypress itself as high because it depends on
      extract-zip and on @cypress/request. Same finding as the entry above,
      keyed by package because the advisory ids belong to the dependencies
      rather than to cypress.
    replacement_considered: >-
      Identical to the entry above: cypress 16.0.0 fixes both dependency chains
      but is younger than the 14-day minimum publish age this repository
      requires, so it cannot be installed yet.
    usage_analysis: >-
      cypress is a devDependency used by the e2e-tests workflow. It is not part
      of any published artifact and is never installed at runtime.
    approved_by: "PENDING second review by @Gradient-DS/security"
    recheck: 2026-12-01
