# Legacy: per-stack Weaviate, Postgres and Redis for the retired soev
# multi-stack tooling (stackctl, removed 2026-09-29). Ports came from the
# generated .env.stack-N files that tooling wrote; nothing in CI or docs
# uses this file. Running against a soev stack: see CLAUDE.md
# "Running against a soev stack".

name: stack

services:
  weaviate:
    image: semitechnologies/weaviate:1.35.0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      OBJECTS_TTL_DELETE_SCHEDULE: "@every 5m"
      LOG_LEVEL: info
    ports:
      - "${WEAVIATE_HTTP_PORT:?must be set per-stack in .env.stack-N}:8080"
      - "${WEAVIATE_GRPC_PORT:?must be set per-stack in .env.stack-N}:50051"
    volumes:
      - weaviate-data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: openwebui
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: dev_password
    ports:
      - "${POSTGRES_PORT:?must be set per-stack in .env.stack-N}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui -d openwebui"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:?must be set per-stack in .env.stack-N}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  weaviate-data: {}
  postgres-data: {}
