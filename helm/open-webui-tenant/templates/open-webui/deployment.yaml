{{- if .Values.openWebui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-webui-tenant.openWebui.fullname" . }}
  labels:
    {{- include "open-webui-tenant.openWebui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.openWebui.replicaCount }}
  {{- with .Values.openWebui.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
    {{- if eq (.type | default "RollingUpdate") "Recreate" }}
    rollingUpdate: null
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "open-webui-tenant.openWebui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-webui-tenant.openWebui.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/open-webui/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- include "open-webui-tenant.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "open-webui-tenant.serviceAccountName" . }}
      {{- with .Values.openWebui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.weaviate.enabled }}
        - name: wait-for-weaviate
          image: busybox:1.36
          {{- with .Values.openWebui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ['sh', '-c', 'until wget -qO- http://{{ include "open-webui-tenant.weaviate.fullname" . }}:8080/v1/.well-known/ready 2>/dev/null; do echo "waiting for weaviate..."; sleep 3; done']
        {{- end }}
        {{- if .Values.redis.enabled }}
        - name: wait-for-redis
          image: busybox:1.36
          {{- with .Values.openWebui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ['sh', '-c', 'until nc -z {{ include "open-webui-tenant.redis.fullname" . }} 6379; do echo "waiting for redis..."; sleep 2; done']
        {{- end }}
        - name: migrate
          image: "{{ .Values.openWebui.image.repository }}:{{ .Values.openWebui.image.tag }}"
          imagePullPolicy: {{ .Values.openWebui.image.pullPolicy }}
          {{- with .Values.openWebui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Import-time trigger: run_migrations() fires when open_webui.config
          # is imported, gated on ENABLE_DB_MIGRATIONS. This explicit override
          # forces it on regardless of the configmap value (which is false on
          # the main Deployment so its pods don't also try to migrate).
          command: ["python", "-c", "import open_webui.config"]
          envFrom:
            - configMapRef:
                name: {{ include "open-webui-tenant.openWebui.fullname" . }}-config
          env:
            - name: ENABLE_DB_MIGRATIONS
              value: "true"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-webui-tenant.fullname" . }}-secrets
                  key: webui-secret-key
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-webui-tenant.fullname" . }}-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}:$(DATABASE_PASSWORD)@{{ include "open-webui-tenant.postgres.host" . }}:{{ include "open-webui-tenant.postgres.port" . }}/{{ .Values.postgres.database }}"
          resources:
            {{- toYaml .Values.openWebui.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      containers:
        - name: open-webui
          image: "{{ .Values.openWebui.image.repository }}:{{ .Values.openWebui.image.tag }}"
          imagePullPolicy: {{ .Values.openWebui.image.pullPolicy }}
          {{- with .Values.openWebui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "open-webui-tenant.openWebui.fullname" . }}-config
          env:
            # [Gradient] Per-pod OTel identity. Without a unique
            # service.instance.id each HA replica exports metrics under an
            # identical series — Mimir commingles them and increase()/rate()
            # inflate by orders of magnitude. Set here (not the ConfigMap)
            # because the pod name is only available via the downward API.
            {{- if .Values.openWebui.config.telemetry.otel.enabled }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.instance.id=$(POD_NAME){{ with .Values.openWebui.config.telemetry.otel.resourceAttributes }},{{ . }}{{ end }}"
            {{- end }}
            {{- include "open-webui-tenant.openWebui.env" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            {{- toYaml .Values.openWebui.resources | nindent 12 }}
          {{- if .Values.openWebui.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.openWebui.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.openWebui.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.openWebui.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.openWebui.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.openWebui.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.openWebui.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.openWebui.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.openWebui.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ .Values.openWebui.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.openWebui.startupProbe.periodSeconds }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.openWebui.persistence.enabled }}
          persistentVolumeClaim:
            {{- if .Values.openWebui.persistence.existingClaim }}
            claimName: {{ .Values.openWebui.persistence.existingClaim }}
            {{- else }}
            claimName: {{ include "open-webui-tenant.openWebui.fullname" . }}-pvc
            {{- end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.openWebui.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
