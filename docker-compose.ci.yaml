# Standalone Phase 1 stack. Never merge with a development Compose file or env_file.
# Build-time downloads are allowed; the running application has only `internal`.
# Recreate the stack for a fresh run: service databases are intentionally ephemeral.
# Tenant feature values and explicit divergences: security/deployed-config.md.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "openwebui"
      POSTGRES_USER: "openwebui"
      POSTGRES_PASSWORD: "ci-only-password"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openwebui", "-d", "openwebui"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  weaviate:
    image: semitechnologies/weaviate:1.35.0
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none" # App supplies stub embeddings; no model downloads.
      ENABLE_MODULES: ""
      DISABLE_TELEMETRY: "true" # Weaviate must not generate ordinary public traffic either.
      CLUSTER_HOSTNAME: "node1"
      QUERY_DEFAULTS_LIMIT: "25"
    tmpfs:
      - /var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [internal]

  redis:
    image: redis:7-alpine
    # Real Redis is mandatory: invalidate_token silently does nothing without it.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  stub:
    image: python:3.11-slim
    command: ["python", "-B", "/stub.py"]
    volumes:
      - ./cicd/stub_upstream.py:/stub.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "ci-s3-access-key"
      MINIO_ROOT_PASSWORD: "ci-only-s3-secret-key"
      MINIO_BROWSER: "off"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  minio-init:
    # This release includes mc as well as the server and curl.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: "no"
    environment:
      S3_ACCESS_KEY_ID: "ci-s3-access-key"
      S3_SECRET_ACCESS_KEY: "ci-only-s3-secret-key"
      S3_BUCKET_NAME: "ci-uploads"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set ci http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" --api S3v4 --path on
        mc mb --ignore-existing "ci/$$S3_BUCKET_NAME"
        mc stat "ci/$$S3_BUCKET_NAME"
    depends_on:
      minio:
        condition: service_healthy
    networks: [internal]

  open-webui:
    container_name: open-webui-ci
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Production builds slim (.github/workflows/docker-build-soev.yaml), which
        # drops torch, transformers, accelerate and the rest of the local ML stack
        # and requires external APIs for embeddings, TTS and STT -- all of which
        # this stack stubs. Building the full image here would drive code paths
        # production does not ship and miss the ones it does.
        USE_SLIM: 'true'
    environment:
      # Stop GitHub update checks and Hugging Face downloads on normal requests.
      OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
      # Config persisted by an earlier request must not override CI destinations.
      ENABLE_PERSISTENT_CONFIG: "false"
      # Explicit parts agree with DATABASE_URL; env.py can rebuild the URL from them.
      DATABASE_URL: "postgresql://openwebui:ci-only-password@postgres:5432/openwebui"
      DATABASE_TYPE: "postgresql"
      DATABASE_HOST: "postgres"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "openwebui"
      DATABASE_USER: "openwebui"
      DATABASE_PASSWORD: "ci-only-password"
      DATABASE_ENABLE_IAM_TOKEN_AUTH: "false"
      # A real vector database and Redis keep retrieval and token revocation live.
      VECTOR_DB: "weaviate"
      ENABLE_WEAVIATE_MULTITENANCY_MODE: "true"
      BYPASS_ADMIN_ACCESS_CONTROL: "false"
      STORAGE_PROVIDER: "s3"
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_BUCKET_NAME: "ci-uploads"
      S3_ACCESS_KEY_ID: "ci-s3-access-key"
      S3_SECRET_ACCESS_KEY: "ci-only-s3-secret-key"
      S3_REGION_NAME: "us-east-1"
      S3_ADDRESSING_STYLE: "path" # MinIO has no bucket-specific DNS names.
      WEAVIATE_HTTP_HOST: "weaviate"
      WEAVIATE_GRPC_HOST: "weaviate"
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_PORT: "50051"
      WEAVIATE_HTTP_SECURE: "false"
      WEAVIATE_GRPC_SECURE: "false"
      REDIS_URL: "redis://redis:6379/0"
      # The scalar default is real api.openai.com, even without a key.
      OPENAI_API_BASE_URL: "http://stub:8000/v1"
      OPENAI_API_BASE_URLS: "http://stub:8000/v1"
      OPENAI_API_KEY: "ci-stub-key"
      OPENAI_API_KEYS: "ci-stub-key"
      # An explicit URL bypasses the import-time Ollama port probes.
      OLLAMA_BASE_URL: "http://stub:8000"
      OLLAMA_BASE_URLS: "http://stub:8000"
      # These handler-reachable fork services must all stay in-network.
      AGENT_API_BASE_URL: "http://stub:8000"
      AGENT_API_ENABLED: "true"
      AGENT_API_AGENTS: "soev_chat_manual,assistant_onboarding"
      AGENT_API_PICKER_DEFAULT_SLUG: "soev_chat_manual"
      FEATURE_AGENT_PICKER: "false"
      ENABLE_AGENT_PROXY: "true"
      AGENT_SEARCH_ENABLED: "true"
      AGENT_API_KEY: "ci-stub-key"
      SEARCH_API_BASE_URL: "http://stub:8000"
      SEARCH_API_KEY: "ci-stub-key"
      SYNC_DAEMON_URL: "http://stub:8000"
      PIPELINE_API_BASE_URL: "http://stub:8000"
      PIPELINE_API_KEY: "ci-stub-key"
      # config.py resets scalar OPENAI_API_BASE_URL after forming the URL list;
      # embedding/audio/image defaults would therefore still point at OpenAI.
      RAG_EMBEDDING_ENGINE: "openai"
      RAG_EMBEDDING_MODEL: "text-embedding-3-small" # Stub returns 1536 dimensions.
      RAG_OPENAI_API_BASE_URL: "http://stub:8000/v1"
      RAG_OPENAI_API_KEY: "ci-stub-key"
      RAG_EXTERNAL_RERANKER_URL: "http://stub:8000/v1/rerank"
      RAG_EXTERNAL_RERANKER_API_KEY: "ci-stub-key"
      RAG_RERANKING_ENGINE: "external"
      RAG_RERANKING_MODEL: "ci-reranker"
      AUDIO_STT_OPENAI_API_BASE_URL: "http://stub:8000/v1"
      AUDIO_STT_OPENAI_API_KEY: "ci-stub-key"
      AUDIO_TTS_OPENAI_API_BASE_URL: "http://stub:8000/v1"
      AUDIO_TTS_OPENAI_API_KEY: "ci-stub-key"
      IMAGES_OPENAI_API_BASE_URL: "http://stub:8000/v1"
      IMAGES_OPENAI_API_KEY: "ci-stub-key"
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: "openai"
      ENABLE_CODE_EXECUTION: "true"
      ENABLE_CODE_INTERPRETER: "true"
      # Snapshot has no engine or Jupyter destination; see the documented gap.
      CODE_EXECUTION_ENGINE: "pyodide"
      CODE_INTERPRETER_ENGINE: "pyodide"
      # Exercise configured webhooks locally.
      WEBHOOK_URL: "http://stub:8000/webhook"
      FEEDBACK_REPORT_SLACK_WEBHOOK_URL: "http://stub:8000/slack"
      FEEDBACK_REPORT_WEBHOOK_URL: "http://stub:8000/feedback"
      ENABLE_FEEDBACK_REPORTING: "True"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://stub:8000/search"
      CONTENT_EXTRACTION_ENGINE: "external"
      EXTERNAL_DOCUMENT_LOADER_URL: "http://stub:8000"
      EXTERNAL_DOCUMENT_LOADER_API_KEY: "ci-stub-key"
      WEB_LOADER_ENGINE: "external"
      EXTERNAL_WEB_LOADER_URL: "http://stub:8000/extract"
      EXTERNAL_WEB_LOADER_API_KEY: "ci-stub-key"
      # Empty means unconfigured, explicitly preventing host-env inheritance.
      ENABLE_OTEL: "" # Otherwise OTLP exporters default to localhost:4317.
      DATALAB_MARKER_API_KEY: "" # Blank Marker URL alone falls back to public datalab.to.
      RAG_CONTENT_EXTRACTION_ENGINE: "" # Plan spelling; retain as an explicit guard.
      CUSTOM_NAME: "" # Legacy custom branding downloads from api.openwebui.com.
      LICENSE_KEY: "" # License lookup contacts public Open WebUI servers.
      COMFYUI_BASE_URL: "" # No ComfyUI image backend selected.
      CODE_EXECUTION_JUPYTER_URL: "" # No external Jupyter kernel configured.
      CODE_INTERPRETER_JUPYTER_URL: "" # Same for the chat code interpreter.
      # OAuth can fetch before login; every provider must remain unconfigured.
      ENABLE_OAUTH_SIGNUP: "true"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      MICROSOFT_CLIENT_ID: ""
      MICROSOFT_CLIENT_SECRET: ""
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      OAUTH_CLIENT_ID: ""
      OAUTH_CLIENT_SECRET: ""
      OPENID_PROVIDER_URL: ""
      FEISHU_CLIENT_ID: ""
      FEISHU_CLIENT_SECRET: ""
      # Cloud sync needs credentials and stored tokens; fresh CI has neither.
      ENABLE_GOOGLE_DRIVE_INTEGRATION: "true"
      ENABLE_GOOGLE_DRIVE_SYNC: "true"
      GOOGLE_DRIVE_CLIENT_ID: ""
      ENABLE_ONEDRIVE_INTEGRATION: "true"
      ONEDRIVE_CLIENT_ID: ""
      ONEDRIVE_CLIENT_ID_PERSONAL: ""
      ONEDRIVE_CLIENT_ID_BUSINESS: ""
      ENABLE_CONFLUENCE_INTEGRATION: "false"
      CONFLUENCE_OAUTH_CLIENT_ID: ""
      CONFLUENCE_OAUTH_CLIENT_SECRET: ""
      CONFLUENCE_BASIC_AUTH_USERNAME: ""
      CONFLUENCE_BASIC_AUTH_API_TOKEN: ""
      CONFLUENCE_SCOPED_API_TOKEN: ""
      # Missing Graph mail credentials raise before token acquisition or sendMail.
      ENABLE_EMAIL_INVITES: "true"
      EMAIL_GRAPH_TENANT_ID: ""
      EMAIL_GRAPH_CLIENT_ID: ""
      EMAIL_GRAPH_CLIENT_SECRET: ""
      # A feature a tenant admin can switch on at runtime is production surface
      # whatever the chart seeds (PersistentConfig), so it runs on here and the
      # plane drives it rather than a waiver hiding it. CI-005.
      ENABLE_2FA: "true"
      # soev-test, gradient and staging require 2FA; driving that needs the plane
      # to enrol TOTP for its identities. Off until it does. CI-005.
      REQUIRE_2FA: "false"
      ENABLE_FORGOT_PASSWORD: "true"
      ENABLE_USER_WEBHOOKS: "true"
      AUDIO_TTS_ENGINE: "openai"
      AUDIO_STT_ENGINE: "openai" # Empty means local Whisper, which the slim image does not ship.
      ENABLE_IMAGE_EDIT: "true"
      # Same reset as the other image defaults: without these, edits go to OpenAI.
      IMAGES_EDIT_OPENAI_API_BASE_URL: "http://stub:8000/v1"
      IMAGES_EDIT_OPENAI_API_KEY: "ci-stub-key"
      # ENABLE_SIGNUP is not set here: the first signup turns it off in-process
      # (routers/auths.py), and the plane's bootstrap is that signup. The plane
      # turns it back on after bootstrap instead.
      # Stable disposable-stack signing key, not a production credential.
      # Must NOT be exactly 44 characters. OAUTH_SESSION_TOKEN_ENCRYPTION_KEY
      # defaults to this value (env.py:782), and OAuthSessionTable treats a
      # 44-character key as a raw Fernet key instead of hashing it
      # (models/oauth_sessions.py:72-77), so the app dies at import with
      # "Fernet key must be 32 url-safe base64-encoded bytes". Any other
      # length is sha256'd into a valid key.
      WEBUI_SECRET_KEY: "ci-only-secret-do-not-use-outside-this-ci-stack"
    volumes:
      # Root-level artefacts are outside the Dockerfile's backend COPY.
      - ./docker-compose.ci.yaml:/app/docker-compose.ci.yaml:ro
      - ./cicd:/app/cicd:ro
      - ./security:/app/security:ro
      # The image copies ./backend only, so the exporter the drift gate re-runs
      # is absent from it. Mounted read-only rather than baked in: it is test
      # tooling, and the runtime image ships no test tooling.
      - ./scripts/security:/app/scripts/security:ro
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      redis:
        condition: service_healthy
      stub:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        # The provider never creates buckets; readiness alone is insufficient.
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s
    networks: [internal]

  entry:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./cicd/nginx-ci.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      open-webui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal, edge]

networks:
  internal:
    internal: true # No external gateway for the guarded app or its dependencies.
  edge: {} # Only the fixed-destination entry proxy may join this network.
